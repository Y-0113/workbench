let _rcPendingVideos=[];   /* 添加表单里暂存的视频 */
let _rcPendingImg='';
function rcAddVideo(){
  const u=document.getElementById('rc_v').value.trim();
  const lab=document.getElementById('rc_vlab').value.trim();
  if(!u){ alert('先粘贴视频链接～'); return; }
  _rcPendingVideos.push({u, label:lab, plat:detectPlat(u)});
  document.getElementById('rc_v').value='';
  document.getElementById('rc_vlab').value='';
  rcRenderVideoList();
}
function rcRemoveVideo(i){ _rcPendingVideos.splice(i,1); rcRenderVideoList(); }
function rcRenderVideoList(){
  const box=document.getElementById('rc_vlist');
  if(!box) return;
  box.innerHTML=_rcPendingVideos.length? `<div style="display:flex;flex-wrap:wrap;gap:6px">${_rcPendingVideos.map((v,i)=>vidBtn(v.u, v.label, v.plat)+` <button type="button" onclick="rcRemoveVideo(${i})" style="background:none;border:none;color:var(--kitty-red);cursor:pointer">×</button>`).join('')}</div>` : '';
}
function rcBindImgPreview(){
  const f=document.getElementById('rc_img');
  const pv=document.getElementById('rc_img_preview');
  if(!f||!pv) return;
  f.onchange=()=>{
    if(f.files&&f.files[0]){
      const r=new FileReader();
      r.onload=()=>{ pv.src=r.result; _rcPendingImg=r.result; };
      r.readAsDataURL(f.files[0]);
    } else { pv.src=recCatImg('炒'); _rcPendingImg=''; }
  };
  /* 默认显示分类默认图 */
  const cat=(document.getElementById('rc_cat')||{}).value||'炒';
  pv.src=recCatImg(cat);
  const sel=document.getElementById('rc_cat');
  if(sel) sel.onchange=()=>{ if(!_rcPendingImg){ pv.src=recCatImg(sel.value); } };
}
function recipeCard(x,i){
  const mats=(x.materials&&x.materials.length)?x.materials.map(m=>`<li>${esc(m)}</li>`).join(''):'<li style="color:var(--ink-soft)">暂无</li>';
  const steps=(x.steps&&x.steps.length)?x.steps.map((s,j)=>`<li><b>${j+1}.</b> ${esc(s)}</li>`).join(''):'<li style="color:var(--ink-soft)">暂无</li>';
  const meta=(x.servings||x.time)?`<div class="rc-meta">${x.servings?`<span class="tag">👥 ${esc(x.servings)}</span>`:''}${x.time?`<span class="tag">⏱ ${esc(x.time)}</span>`:''}</div>`:'';
  const img=x.img || recCatImg(x.cat);
  const cat=recipeCatById(x.cat);
  /* 视频：兼容旧的 video 字段和新的 videos 数组 */
  let videos=[];
  if(Array.isArray(x.videos)&&x.videos.length) videos=x.videos;
  else if(x.video) videos=[{u:x.video, label:'', plat:detectPlat(x.video)}];
  return `<div class="recipe-card" style="overflow:hidden">
    <div class="rc-head" onclick="toggleRecipe(${i})" style="display:flex;gap:10px;align-items:center">
      ${img?`<img src="${esc(img)}" style="width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:#faf0f4">`:`<div style="width:64px;height:64px;border-radius:12px;background:${cat.bg};display:flex;align-items:center;justify-content:center;font-size:30px;flex:none">${cat.emoji}</div>`}
      <div style="flex:1;min-width:0">
        <div><b>${esc(x.t)}</b> ${x.tag?`<span class="tag">${esc(x.tag)}</span>`:''}</div>
        <div style="margin-top:4px"><span class="tag" style="background:${cat.bg};color:var(--ink)">${cat.emoji} ${esc(x.cat)}</span></div>
      </div>
      <span class="rc-toggle" id="rcg${i}">▾ 详情</span>
    </div>
    ${meta}
    <div class="rc-body" id="rcb${i}" style="display:none">
      ${videos.length?`<div class="rc-sub">🎬 视频教程（点击跳转）</div>${vidRow(videos)}`:''}
      <div class="rc-sub">🧺 需要准备的材料</div><ul class="rc-list">${mats}</ul>
      <div class="rc-sub">👩‍🍳 详细步骤</div><ol class="rc-list">${steps}</ol>
      <button class="del" style="margin-top:6px;background:none;border:none;color:var(--kitty-red);font-size:13px;cursor:pointer" onclick="event.stopPropagation();delRecipe(${i})">删除这道菜</button>
    </div></div>`;
}
function toggleRecipe(i){ const b=document.getElementById('rcb'+i); const open=b.style.display!=='none'; b.style.display=open?'none':'block'; document.getElementById('rcg'+i).textContent=open?'▾ 详情':'▴ 收起'; }
function recRerollRecipe(){
  const items=DB.get("recipe",DEF.recipe).map(normalizeRecipe); if(!items.length)return;
  const p=items[Math.floor(Math.random()*items.length)];
  const img=p.img||recCatImg(p.cat);
  const cat=recipeCatById(p.cat);
  document.getElementById('recPick').innerHTML=`
    ${img?`<img src="${esc(img)}" style="width:78px;height:78px;border-radius:14px;object-fit:cover;flex:none">`:`<div style="width:78px;height:78px;border-radius:14px;background:${cat.bg};display:flex;align-items:center;justify-content:center;font-size:42px;flex:none">${cat.emoji}</div>`}
    <div style="flex:1;min-width:0">
      <div style="font-size:18px;font-weight:800">${esc(p.t)}</div>
      ${p.d?`<div style="font-size:12px;color:var(--ink-soft);margin-top:3px">${esc(p.d)}</div>`:''}
      ${p.cat?`<span class="tag" style="margin-top:6px;display:inline-block">${cat.emoji} ${esc(p.cat)}</span>`:''}
    </div>`;
}
function addRecipe(){
  const t=document.getElementById('rc_t').value.trim(); if(!t)return;
  const materials=document.getElementById('rc_m').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const steps=document.getElementById('rc_s').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const cat=document.getElementById('rc_cat').value;
  /* 残留的 rc_v 输入框有内容时自动加入 */
  const v=document.getElementById('rc_v').value.trim();
  if(v){ _rcPendingVideos.push({u:v, label:document.getElementById('rc_vlab').value.trim(), plat:detectPlat(v)}); }
  const videos=_rcPendingVideos.slice();
  const img=_rcPendingImg || recCatImg(cat);
  let a=DB.get("recipe",DEF.recipe).map(normalizeRecipe);
  a.push({t,d:document.getElementById('rc_d').value.trim(),tag:document.getElementById('rc_tag').value.trim(),cat,servings:document.getElementById('rc_servings').value.trim(),time:document.getElementById('rc_time').value.trim(),materials,steps,videos,img,video:videos.length? videos[0].u : ''});
  DB.set("recipe",a);
  document.getElementById('rc_t').value='';document.getElementById('rc_d').value='';document.getElementById('rc_tag').value='';document.getElementById('rc_servings').value='';document.getElementById('rc_time').value='';document.getElementById('rc_m').value='';document.getElementById('rc_s').value='';document.getElementById('rc_v').value='';document.getElementById('rc_vlab').value='';
  _rcPendingVideos=[]; _rcPendingImg='';
  document.getElementById('recipeList').innerHTML=a.map((x,i)=>recipeCard(x,i)).join('');
}
function delRecipe(i){ let a=DB.get("recipe",DEF.recipe).map(normalizeRecipe); a.splice(i,1); DB.set("recipe",a); document.getElementById('recipeList').innerHTML=a.map((x,j)=>recipeCard(x,j)).join(''); }

/* ===== 电子衣橱 ===== */
function viewWardrobe(){
  const lw=DB.get("wardWeather",null);
  const city=DB.get("wardCity","");
  const wbox=lw?renderWeatherBox(lw.city,lw.temp,lw.code):`<div class="weather-temp">--°</div><div class="weather-info"><div id="wCity">${city||'设置城市'}</div><div id="wDesc">点下面获取实时天气</div></div><div class="weather-tip" id="wTip">根据温度，给你合适的穿搭建议～</div>`;
  return `<div class="page-title">👗 电子衣橱</div><div class="page-desc">上传实物图 · 点图加入搭配 · 左右滑动看衣橱</div>
    <div class="weather-box">
      <div class="weather-top">${wbox}</div>
      <div class="weather-input">
        <input id="wCityIn" placeholder="输入城市，如：上海" value="${esc(city)}">
        <button class="btn btn-soft" onclick="fetchWeather()">获取天气</button>
      </div>
    </div>
    <div id="wardBox">${wardInner()}</div>`;
}
const WCODE={0:["晴",""],1:["大致晴朗",""],2:["局部多云",""],3:["阴",""],45:["雾",""],48:["雾凇",""],51:["毛毛雨",""],53:["小雨",""],55:["中雨",""],61:["小雨",""],63:["中雨",""],65:["大雨",""],71:["小雪",""],73:["中雪",""],75:["大雪",""],80:["阵雨",""],81:["阵雨",""],82:["强阵雨",""],85:["阵雪",""],95:["雷阵雨",""],96:["雷阵雨伴冰雹",""]};
function weatherTip(temp,code){
  let t;
  if(temp>=30) t="🔥 高温！轻薄透气为主，防晒 + 帽子 + 多喝水。";
  else if(temp>=24) t="☀️ 短袖 / 连衣裙很舒服，备一件薄外套应对空调房。";
  else if(temp>=18) t="🌤️ 长袖 T 恤或薄卫衣，早晚加件外套刚刚好。";
  else if(temp>=12) t="🧥 毛衣 / 风衣上阵，下装选长裤或厚袜。";
  else if(temp>=5) t="🧣 羽绒 / 棉服 + 围巾，注意保暖层次。";
  else t="❄️ 严寒！厚羽绒 + 帽子手套，能裹多厚裹多厚。";
  const d=WCODE[code]; if(d&&/雨|雪|雷/.test(d[0])) t+=" 今天"+d[0]+"，记得带伞 ☂️";
  return t;
}
function renderWeatherBox(city,temp,code){
  const d=WCODE[code]?WCODE[code][0]:"";
  return `<div class="weather-temp">${temp}°</div>
    <div class="weather-info"><div id="wCity">${esc(city)}</div><div id="wDesc">${d||'实时天气'}</div></div>
    <div class="weather-tip" id="wTip">${weatherTip(temp,code)}</div>`;
}
async function fetchWeather(){
  const city=(document.getElementById('wCityIn').value||'').trim(); if(!city){alert('请输入城市');return;}
  try{
    const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=zh')).json();
    if(!g.results||!g.results.length){alert('没找到这个城市，换个写法试试');return;}
    const r=g.results[0];
    const f=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude='+r.latitude+'&longitude='+r.longitude+'&current=temperature_2m,weather_code')).json();
    const temp=Math.round(f.current.temperature_2m), code=f.current.weather_code;
    const cname=r.name+(r.country?(' · '+r.country):'');
    DB.set('wardCity',city); DB.set('wardWeather',{city:cname,temp,code});
    document.querySelector('.weather-top').innerHTML=renderWeatherBox(cname,temp,code);
  }catch(e){ alert('天气获取失败，请检查网络后重试'); }
}
const WCATS=[{key:"top",label:"上装",ic:"👚"},{key:"bottom",label:"下装",ic:"👖"},{key:"shoes",label:"鞋子",ic:"👟"}];
let wardSeason='全部';
function wardData(){ return DB.get("wardrobe",DEF.wardrobe); }
function catIcon(cat){return cat==='top'?'👚':cat==='bottom'?'👖':'👟';}
function readImg(file,cb){
  const r=new FileReader();
  r.onload=e=>{ const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height,max=400; if(w>max){h=Math.round(h*max/w);w=max;}
      const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.7)); };
    img.src=e.target.result; };
  r.readAsDataURL(file);
}
function wardInner(){
  const w=wardData(); const worn=w.worn||{};
  const pick=WCATS.map(c=>({c,it:w.items.find(x=>x.id===worn[c.key])}));
  const layers=pick.map(p=>`<div class="fit-layer ${p.c.key==='top'?'fit-top':p.c.key==='bottom'?'fit-bottom':'fit-shoe'}">
    ${p.it&&p.it.img?`<img src="${p.it.img}">`:`<div class="ph">${p.c.ic}</div>`}</div>`).join('');
  const names=pick.map(p=>`<div class="fit-name">${p.it?esc(p.it.name):p.c.label+'：未选'}</div>`).join('');
  const sil=`<div class="fit-sil fit-head"></div><div class="fit-sil fit-torso"></div><div class="fit-sil fit-legL"></div><div class="fit-sil fit-legR"></div><div class="fit-sil fit-footL"></div><div class="fit-sil fit-footR"></div>`;
  const preview=`<div class="fit-preview">
    <div class="fit-body">${sil}${layers}</div>
    <div>${names}</div>
    <div class="fit-actions">
      <button class="btn btn-pink" onclick="wardRandom()">🎲 随机一套</button>
      <button class="btn btn-soft" onclick="wardClear()">🔄 清空</button>
    </div></div>`;
  const tracks=WCATS.map(c=>{
    const list=w.items.filter(x=>x.cat===c.key && (wardSeason==='全部'||x.season===wardSeason||x.season==='四季'));
    const cards=list.map(x=>wardCard(x,c.key,worn)).join('');
    const addCard=`<div class="ward-add-card" onclick="document.getElementById('wd_cat').value='${c.key}';document.getElementById('wd_name').focus();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">＋<br>加${c.label}</div>`;
    return `<div class="ward-sec"><div class="ward-sec-h">${c.ic} ${c.label}（左右滑动挑选）</div>
      <div class="ward-track">${cards}${addCard}</div></div>`;
  }).join('');
  const chips=['全部','春','夏','秋','冬'].map(s=>`<button class="chip ${s===wardSeason?'on':''}" onclick="setWardSeason('${s}')">${s==='全部'?'全部':s+'季'}</button>`).join('');
  return preview+`<div class="chips" style="margin:2px 0 4px">${chips}</div>`+tracks+
   `<div class="sec-title" style="margin-top:14px">添加我的衣物（可上传实物图）</div>
    <div class="add" style="flex-wrap:wrap;margin-top:8px">
      <input id="wd_name" placeholder="例如：米色风衣" style="flex:1 1 100%" onkeydown="if(event.key==='Enter')wardAdd()">
      <select id="wd_cat">${WCATS.map(c=>`<option value="${c.key}">${c.label}</option>`).join('')}</select>
      <input id="wd_color" placeholder="颜色" style="width:78px" onkeydown="if(event.key==='Enter')wardAdd()">
      <select id="wd_season">${["四季","春","夏","秋","冬"].map(s=>`<option>${s}</option>`).join('')}</select>
      <label style="font-size:12px;display:flex;align-items:center;gap:6px;flex:1 1 100%"><span>📷 实物图</span><input type="file" id="wd_img" accept="image/*" style="font-size:11px;max-width:200px"></label>
      <button onclick="wardAdd()">添加</button>
    </div>`;
}
function wardCard(x,cat,worn){
  const on=worn[cat]===x.id;
  return `<div class="ward-card ${on?'on':''}" onclick="wardSelect('${cat}',${x.id})">
    ${x.img?`<img class="ward-img" src="${x.img}">`:`<div class="ward-ph">${catIcon(x.cat)}</div>`}
    <div class="wi-name">${esc(x.name)}</div>
    <div class="wi-sub">${x.color?esc(x.color)+' · ':''}${esc(x.season)}</div>
    ${on?`<div style="position:absolute;top:6px;left:6px;background:var(--kitty-red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px">已选</div>`:''}
    <button class="del" onclick="event.stopPropagation();wardDel(${x.id})" style="position:absolute;top:6px;right:6px;background:transparent;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer">×</button>
  </div>`;
}
function wardClear(){ const w=wardData(); w.worn={}; DB.set("wardrobe",w); document.getElementById('wardBox').innerHTML=wardInner(); }
function wardSelect(cat,id){ const w=wardData(); w.worn=w.worn||{}; w.worn[cat]=w.worn[cat]===id?null:id; DB.set("wardrobe",w); document.getElementById('wardBox').innerHTML=wardInner(); }
function wardRandom(){ const w=wardData(); const byCat={}; w.items.forEach(x=>{(byCat[x.cat]=byCat[x.cat]||[]).push(x);}); w.worn={}; WCATS.forEach(c=>{const l=byCat[c.key]; if(l&&l.length)w.worn[c.key]=l[Math.floor(Math.random()*l.length)].id;}); DB.set("wardrobe",w); document.getElementById('wardBox').innerHTML=wardInner(); }
function wardAdd(){

let searchOpen=false;
function toggleSearch(){

  if(box){ box.classList.toggle('open', searchOpen); if(searchOpen){ box.style.display='block'; setTimeout(()=>input&&input.focus(),50); } else { box.style.display='none'; } }
  if(searchOpen) renderSearchResults('');

function globalSearch(query){
  const q=(query||'').trim().toLowerCase();
  const box=document.getElementById('globalSearchResults');
  if(!q){ if(box) box.innerHTML='<p style="padding:12px;color:var(--ink-soft);text-align:center">输入关键词搜索所有模块</p>'; return; }
  
  const results=[];
  const all=DB.all();
  // plan
  (DB.get("plan",[])||[]).forEach((t,i)=>{ if(String(t).toLowerCase().includes(q)) results.push({mod:'plan',modIc:'📋',modName:'每日计划',title:String(t),route:'plan',sub:'待办'}) });
  DB.get("planHist",[]).forEach(h=>{ if(String(h.text).toLowerCase().includes(q)) results.push({mod:'plan',modIc:'📋',modName:'每日计划',title:String(h.text),route:'plan',sub:'已完成 '+h.date}) });
  // spark
  DB.get("spark",[]).map(normalizeSpark).forEach(s=>{ if((s.t||'').toLowerCase().includes(q)) results.push({mod:'spark',modIc:'✨',modName:'灵光一现',title:s.t,route:'spark',sub:s.cat}) });
  // recipe
  DB.get("recipe",DEF.recipe).map(normalizeRecipe).forEach(r=>{ if((r.t||'').toLowerCase().includes(q)||(r.d||'').toLowerCase().includes(q)) results.push({mod:'recipe',modIc:'🍳',modName:'菜谱',title:r.t,route:'recipe',sub:r.d||r.cat||''}) });
  // body
  bodyLog().forEach(b=>{ const text=[b.states||[],b.note||'',b.date||''].join(' ').toLowerCase(); if(text.includes(q)) results.push({mod:'body',modIc:'🌡️',modName:'体感实录',title:b.date,route:'body',sub:(b.states||[]).join(',')+(b.note?(' · '+b.note):'')}) });
  // fitness
  DB.get("fitnessHabits",DEF.fitnessHabits).map(normalizeFit).forEach(f=>{ if((f.t||'').toLowerCase().includes(q)) results.push({mod:'fitness',modIc:'💪',modName:'运动健身',title:f.t,route:'fitness',sub:'训练'}) });
  // english
  const enStreakV=DB.get("enStreak",0)||0;
  if(String(enStreakV).includes(q)||'英语'.includes(q)) results.push({mod:'english',modIc:'📚',modName:'英语学习',title:'连续打卡 '+enStreakV+' 天',route:'english',sub:'英语学习'});
  // ielts
  const ip=DB.get("ieltsPlan",DEF.ieltsPlan);
  Object.entries(ip||{}).forEach(([k,arr])=>{ (arr||[]).forEach(x=>{ if((x.t||'').toLowerCase().includes(q)) results.push({mod:'ielts',modIc:'🎯',modName:'雅思学习',title:x.t,route:'ielts',sub:'skill:'+k}) }) });
  // makeup
  DB.get("makeup",DEF.makeup).map(normalizeMakeup).forEach(m=>{ if((m.t||'').toLowerCase().includes(q)) results.push({mod:'makeup',modIc:'💄',modName:'妆容',title:m.t,route:'makeup',sub:m.cat||''}) });
  // wardrobe
  const wd=DB.get("wardrobe",DEF.wardrobe);
  (wd.items||[]).forEach(it=>{ if((it.name||'').toLowerCase().includes(q)||(it.color||'').toLowerCase().includes(q)) results.push({mod:'wardrobe',modIc:'👗',modName:'电子衣橱',title:it.name,route:'wardrobe',sub:(it.color||'')+' · '+(it.season||'')}) });
  // media
  const md=DB.get("media",DEF.media);
  (md.ideas||[]).forEach(x=>{ if((x.t||'').toLowerCase().includes(q)) results.push({mod:'media',modIc:'🎬',modName:'自媒体',title:x.t,route:'media',sub:'选题'}) });
  (md.copy||[]).forEach(x=>{ if((x.t||'').toLowerCase().includes(q)||(x.text||'').toLowerCase().includes(q)) results.push({mod:'media',modIc:'🎬',modName:'自媒体',title:x.t,route:'media',sub:'文案'}) });
  (md.review||[]).forEach(x=>{ if((x.t||'').toLowerCase().includes(q)) results.push({mod:'media',modIc:'🎬',modName:'自媒体',title:x.t,route:'media',sub:'复盘'}) });
  // kaka
  const kk=DB.get("kaka",DEF.kaka);
  (kk.moments||[]).forEach(x=>{ if((x.text||'').toLowerCase().includes(q)) results.push({mod:'kaka',modIc:'🐶',modName:'卡卡',title:x.text,route:'kaka',sub:x.date||''}) });
  // short
  DB.get("short",DEF.short).forEach(s=>{ if((s.t||'').toLowerCase().includes(q)||(s.body||'').toLowerCase().includes(q)) results.push({mod:'short',modIc:'📝',modName:'今日短篇',title:s.t,route:'short',sub:s.author||''}) });
  // travel
  DB.get("travel",DEF.travel).forEach(t=>{ 
    if((t.city||'').toLowerCase().includes(q)||(t.text||'').toLowerCase().includes(q)||(t.with||'').toLowerCase().includes(q)) results.push({mod:'travel',modIc:'✈️',modName:'旅行足迹',title:t.city+' · '+t.date,route:'travel',sub:t.text||''});
    (t.spots||[]).forEach(s=>{ if((s.name||'').toLowerCase().includes(q)||(s.text||'').toLowerCase().includes(q)) results.push({mod:'travel',modIc:'✈️',modName:'旅行足迹',title:s.name,route:'travel',sub:s.text||''}) });
    (t.foods||[]).forEach(s=>{ if((s.name||'').toLowerCase().includes(q)) results.push({mod:'travel',modIc:'✈️',modName:'旅行足迹',title:'🍜 '+s.name,route:'travel',sub:s.text||''}) });
  });
  // goods
  goodsLog().forEach(g=>{ if((g.name||'').toLowerCase().includes(q)||(g.cat||'').toLowerCase().includes(q)) results.push({mod:'goods',modIc:'📦',modName:'良品宜物',title:g.name,route:'goods',sub:(g.cat||'')+' · '+g.type}) });
  // ledger
  ledgerLog().forEach(l=>{ if((l.note||'').toLowerCase().includes(q)||(l.cat||'').toLowerCase().includes(q)||(l.city||'').toLowerCase().includes(q)) results.push({mod:'ledger',modIc:'💰',modName:'账本',title:(l.note||l.cat||'记账')+' '+money(l.amount,0),route:'ledger',sub:(l.city?('📍'+l.city+' · '):'')+(l.date||'')+' · '+(l.cat||'')}) });
  
  if(!results.length){ if(box) box.innerHTML='<p style="padding:14px;color:var(--ink-soft);text-align:center">没有找到「'+esc(q)+'」相关的内容</p>'; return; }
  if(box) box.innerHTML=`<div class="search-count">找到 ${results.length} 条结果</div>`+results.slice(0,30).map(r=>`<div class="search-item" onclick="closeSearchAndGo('${r.route}')">
    <span class="search-ic">${r.modIc}</span>
    <div style="flex:1;min-width:0">
      <div class="search-title">${esc(r.title)}</div>
      <div class="search-sub">${esc(r.sub||r.modName)}</div>
    </div>
    <span class="tag">${esc(r.modName)}</span>
  </div>`).join('')+(results.length>30?`<p style="padding:8px;text-align:center;color:var(--ink-soft);font-size:12px">还有 ${results.length-30} 条…</p>`:'');
}
function renderSearchResults(q){ globalSearch(q); }
function closeSearchAndGo(route){
  toggleSearch();
  setRoute(route);
}

function importFull(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
    const data=JSON.parse(r.result);
    if(!data) { alert('文件格式不对'); return; }
    if(data.main) localStorage.setItem(DB.key, JSON.stringify(data.main));
    if(data.body) setBodyLog(data.body);
    if(data.goods) setGoodsLog(data.goods);
    if(data.ledger) setLedgerLog(data.ledger);
    if(data.mood) setMoodLog(data.mood);
    if(data.pwd) localStorage.setItem(PWD_KEY, data.pwd);
    if(data.pwdMeta) localStorage.setItem(PWD_META, data.pwdMeta);
    if(data.syncCode) localStorage.setItem('sync_code', data.syncCode);
    if(data.settings){
      if(data.settings.navCollapsed) localStorage.setItem('xinyi_nav_collapsed', data.settings.navCollapsed);
      if(data.settings.amountHidden) localStorage.setItem('xinyi_amount_hidden', data.settings.amountHidden);

    }
    alert("完整恢复成功，正在刷新…"); location.reload();
  } catch(e){ alert("文件格式不对，导入失败"); } };
  r.readAsText(file);
}

/* ===== 模块联动：旅行 → 衣橱天气 + 账本城市 ===== */
function tripCityWeather(city){
  // 在旅行添加时，自动获取该城市天气并保存到旅行记录
  if(!city) return;
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=zh')
    .then(r=>r.json())
    .then(g=>{
      if(!g.results||!g.results.length) return;
      const r=g.results[0];
      return fetch('https://api.open-meteo.com/v1/forecast?latitude='+r.latitude+'&longitude='+r.longitude+'&current=temperature_2m,weather_code');
    })
    .then(r=>r?r.json():null)
    .then(f=>{
      if(!f||!f.current) return;
      const temp=Math.round(f.current.temperature_2m), code=f.current.weather_code;
      DB.set('wardCity', city);
      DB.set('wardWeather',{city:city+' · 实时天气',temp,code,fromTravel:true});
      // 更新旅行记录中的天气
      const arr=DB.get('travel',DEF.travel);
      const last=arr[arr.length-1];
      if(last&&last.city===city){ last.weather={temp,code}; DB.set('travel',arr); }
    })
    .catch(()=>{});
}
// 账本联动：旅行期间支出自动归集到最近旅行城市
function ledgerAutoCity(){
  const travel=DB.get("travel",DEF.travel);
  if(!travel.length) return null;
  // 找最近的旅行（日期<=今天）
  const todayDate=keyDate;
  const recent=travel.filter(t=>t.date<=todayDate).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!recent) return null;
  // 如果今天在旅行日期后 5 天内，自动归集
  const daysDiff=Math.round((new Date(todayDate)-new Date(recent.date))/86400000);
  if(daysDiff>=0&&daysDiff<=5) return recent.city;
  return null;
}

/* ===== 浏览器通知提醒 ===== */
let notifEnabled=(localStorage.getItem('xinyi_notif')==='1');
function notifSupport(){ return 'Notification' in window; }
function requestNotifPerm(){
  if(!notifSupport()){ alert('当前浏览器不支持通知'); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==='granted'){ notifEnabled=true; localStorage.setItem('xinyi_notif','1'); alert('通知已开启 ✓'); }
    else if(perm==='denied'){ notifEnabled=false; localStorage.setItem('xinyi_notif','0'); alert('通知权限被拒绝，请在浏览器设置中开启'); }
  });
}
function sendNotif(title,body,icon){
  if(!notifEnabled) return;
  if(!notifSupport()) return;
  if(Notification.permission!=='granted') return;
  try{
    const n=new Notification(title,{body,icon:icon||'./app-icon.png',tag:'xinyi'});
    setTimeout(()=>n.close(),10000);
  }catch(e){}
}
function startReminders(){
  // 喝水提醒：每 30 分钟检测一次，如 10:00-22:00 之间且当天喝水<8杯，推送提醒
  const waterInterval=setInterval(()=>{
    const h=new Date().getHours();
    const water=DB.get("water",0);
    if(notifEnabled && h>=10 && h<=22 && water<8){
      sendNotif('💧 该喝水啦','你今天喝了 '+water+' 杯，目标 8 杯哦～');
    }
  }, 30*60*1000);
  // 每 60 分钟检查一次计划完成提醒
  setInterval(()=>{
    if(!notifEnabled) return;
    const tasks=DB.get("plan",[]);
    const done=DB.get("planDone",[]);
    const remaining=tasks.length-done.length;
    if(remaining>0){
      const h=new Date().getHours();
      if(h>=18){ sendNotif('📋 今日待办提醒','还有 '+remaining+' 项未完成，加油！'); }
    }
  }, 60*60*1000);
}

function travelAddItem(tid,cat){
  const n=document.getElementById('trn_'+tid+'_'+cat), t=document.getElementById('trt_'+tid+'_'+cat), f=document.getElementById('tri_'+tid+'_'+cat);
  const name=(n?n.value:'').trim();

  if(cat==='foods'){ const r=document.getElementById('trr_'+tid+'_'+cat); item.rating=r?Number(r.value):5; }
  const arr=DB.get('travel',DEF.travel); const trip=arr.find(x=>x.id===tid); if(!trip) return;
  const finish=(img)=>{ item.img=img||''; if(!trip[cat]) trip[cat]=[]; trip[cat].push(item); DB.set('travel',arr); setRoute('travel'); };

}

<script>
/* ===== 主题个性化设置面板（新增模块，不动原有任何功能） ===== */
(function(){
  var LS_AVATAR='xy_custom_avatar';
  var LS_BG_IMG='xy_custom_bg_img';
  var LS_BG_MODE='xy_custom_bg_mode';
  var LS_BG_OP='xy_custom_bg_opacity';
  var LS_THEME='xy_custom_theme';

  var defaultAvatar='';
  function captureDefault(){
    var a=document.getElementById('sbAvatarImg');
    if(a && a.src && a.src.indexOf('data:')===0) defaultAvatar=a.src;
  }

  /* ---- HSL 颜色派生工具 ---- */
  function hex2hsl(h){
    h=h.replace('#',''); if(h.length===3) h=h.split('').map(function(c){return c+c}).join('');
    var r=parseInt(h.substr(0,2),16)/255, g=parseInt(h.substr(2,2),16)/255, b=parseInt(h.substr(4,2),16)/255;
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b); var hue,s,l=(mx+mn)/2;
    if(mx===mn){hue=0;s=0;}
    else{var d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      if(mx===r) hue=(g-b)/d+(g<b?6:0); else if(mx===g) hue=(b-r)/d+2; else hue=(r-g)/d+4;
      hue/=6;}
    return [hue*360, s*100, l*100];
  }
  function hsl2hex(h,s,l){
    s/=100; l/=100;
    var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
    var r,g,b;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    function to(v){return Math.round((v+m)*255).toString(16).padStart(2,'0');}
    return '#'+to(r)+to(g)+to(b);
  }

  /* ---- 应用头像 ---- */
  function applyAvatar(){
    var a=document.getElementById('sbAvatarImg'); if(!a) return;
    var custom=localStorage.getItem(LS_AVATAR);
    if(custom){
      a.src=custom;
      a.style.borderRadius='50%'; a.style.objectFit='cover';
      a.style.width='48px'; a.style.height='48px'; a.style.display='block';
    } else if(defaultAvatar){
      a.src=defaultAvatar;
    }
  }

  /* ---- 应用背景 ---- */
  function applyBg(){
    var layer=document.getElementById('xyBg'); if(!layer) return;
    var img=localStorage.getItem(LS_BG_IMG);
    if(!img){ layer.style.backgroundImage=''; layer.style.opacity='0'; return; }
    var mode=localStorage.getItem(LS_BG_MODE)||'cover';
    var op=(parseInt(localStorage.getItem(LS_BG_OP))||80)/100;
    layer.style.backgroundImage='url("'+img+'")';
    layer.style.opacity=String(op);
    if(mode==='tile'){ layer.style.backgroundSize='auto'; layer.style.backgroundRepeat='round'; layer.style.backgroundPosition='0 0'; }
    else if(mode==='center'){ layer.style.backgroundSize='contain'; layer.style.backgroundRepeat='no-repeat'; layer.style.backgroundPosition='center'; }
    else { layer.style.backgroundSize='cover'; layer.style.backgroundRepeat='no-repeat'; layer.style.backgroundPosition='center'; }
  }

  /* ---- 应用主题色 ---- */
  function applyTheme(){
    var hex=localStorage.getItem(LS_THEME); var root=document.documentElement;
    var keys=['--kitty-red','--kitty-red-dark','--kitty-pink','--kitty-pink-soft','--bg1','--bg2','--bg3','--line'];
    if(!hex){
      keys.forEach(function(k){ root.style.removeProperty(k); });
      return;
    }
    var hsl=hex2hsl(hex); var h=hsl[0],s=hsl[1],l=hsl[2];
    root.style.setProperty('--kitty-red',hex);
    root.style.setProperty('--kitty-red-dark', hsl2hex(h,Math.min(s+5,100),Math.max(l-16,8)));
    root.style.setProperty('--kitty-pink', hsl2hex(h,Math.max(s-8,10),Math.min(l+12,92)));
    root.style.setProperty('--kitty-pink-soft', hsl2hex(h,Math.max(s-18,8),Math.min(l+22,95)));
    root.style.setProperty('--bg1', hsl2hex(h,Math.max(s-35,5),Math.min(l+35,97)));
    root.style.setProperty('--bg2', hsl2hex(h,Math.max(s-30,8),Math.min(l+28,94)));
    root.style.setProperty('--bg3', hsl2hex(h,Math.max(s-25,10),Math.min(l+20,90)));
    root.style.setProperty('--line', hsl2hex(h,Math.max(s-25,10),Math.min(l+30,94)));
  }

  function applyAll(){ applyAvatar(); applyBg(); applyTheme(); }
  window.xyApplyAll=applyAll;

  /* ---- 上传头像 ---- */
  window.xyUploadAvatar=function(f){
    if(!f) return;
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var size=Math.min(img.width,img.height);
        var canvas=document.createElement('canvas');
        canvas.width=128; canvas.height=128;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,(img.width-size)/2,(img.height-size)/2,size,size,0,0,128,128);
        var data=canvas.toDataURL('image/png');
        try{ localStorage.setItem(LS_AVATAR,data); }catch(err){ alert('图片太大存不下，换张小一点的'); return; }
        applyAvatar();
        setRoute('theme');
        alert('头像更换成功 ✓');
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(f);
  };
  window.xyResetAvatar=function(){ localStorage.removeItem(LS_AVATAR); applyAvatar(); setRoute('theme'); alert('已恢复默认 Hello Kitty 头像'); };

  /* ---- 上传背景 ---- */
  window.xyUploadBg=function(f){
    if(!f) return;
    if(f.size>2000000){ alert('图片超过2MB，页面会卡，换张小一点的。'); return; }
    var reader=new FileReader();
    reader.onload=function(e){
      try{ localStorage.setItem(LS_BG_IMG,e.target.result); }catch(err){ alert('背景图太大存不下，换张小一点的'); return; }
      applyBg(); setRoute('theme'); alert('背景已设置 ✓');
    };
    reader.readAsDataURL(f);
  };
  window.xySetBgMode=function(m){ localStorage.setItem(LS_BG_MODE,m); applyBg(); setRoute('theme'); };
  window.xySetBgOpacity=function(v){ localStorage.setItem(LS_BG_OP,v); applyBg(); var el=document.getElementById('xyBgOpVal'); if(el) el.textContent=v+'%'; };
  window.xyResetBg=function(){ localStorage.removeItem(LS_BG_IMG); localStorage.removeItem(LS_BG_MODE); localStorage.removeItem(LS_BG_OP); applyBg(); setRoute('theme'); alert('已恢复默认粉色背景'); };

  /* ---- 主题色 ---- */
  window.xySetTheme=function(hex){ localStorage.setItem(LS_THEME,hex); applyTheme(); setRoute('theme'); };
  window.xyResetTheme=function(){ localStorage.removeItem(LS_THEME); applyTheme(); setRoute('theme'); alert('已恢复默认粉色主题'); };

  /* ---- 面板视图 ---- */
  window.viewTheme=function(){
    var avatar=localStorage.getItem(LS_AVATAR);
    var bgImg=localStorage.getItem(LS_BG_IMG);
    var bgMode=localStorage.getItem(LS_BG_MODE)||'cover';
    var bgOp=parseInt(localStorage.getItem(LS_BG_OP))||80;
    var theme=localStorage.getItem(LS_THEME);
    var presets=[
      ['🌸','粉色','#e8485c'],['🌿','薄荷绿','#5dbf7d'],['☁️','天空蓝','#5a9fd4'],
      ['💜','薰衣草','#c27fcf'],['🍑','蜜桃橙','#f28e66'],['🍋','柠檬黄','#f2b82e'],
      ['🤎','摩卡棕','#8b6f47'],['🖤','高级灰','#6b6b6b']
    ];
    function modeBtn(m,label){ return '<button class="'+(bgMode===m?'sel':'')+'" onclick="xySetBgMode(\''+m+'\')">'+label+'</button>'; }
    var phtml=presets.map(function(p){
      return '<div style="text-align:center">'+
        '<div class="xy-swatch '+(theme===p[2]?'sel':'')+'" style="background:'+p[2]+'" onclick="xySetTheme(\''+p[2]+'\')" title="'+p[1]+'">'+p[0]+'</div>'+
        '<div style="font-size:10px;color:var(--ink-soft);margin-top:4px">'+p[1]+'</div></div>';
    }).join('');

    return '<div class="page-title">🎨 主题个性化</div>'+
      '<div class="page-desc">头像、背景、主题色随时换，刷新不丢失，不影响任何原有功能</div>'+
      '<div class="xy-panel">'+

      '<div class="xy-card">'+
        '<h3>🖼️ 头像图标</h3>'+
        '<div class="xy-desc">从相册选一张图，自动居中裁成正方形、圆形显示；随时可换回 Hello Kitty。</div>'+
        '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">'+
          '<img class="xy-avatar-preview" src="'+(avatar?avatar:(defaultAvatar||''))+'" alt="预览">'+
          '<div>'+
            '<label class="xy-upload-btn">📷 从相册上传<input type="file" accept="image/*" onchange="xyUploadAvatar(this.files[0])" style="display:none"></label> '+
            '<button class="xy-reset-btn" onclick="xyResetAvatar()">↺ 恢复 Kitty</button>'+
          '</div>'+
        '</div>'+
      '</div>'+

      '<div class="xy-card">'+
        '<h3>🏔️ 背景图片</h3>'+
        '<div class="xy-desc">上传自定义背景，可调平铺/居中/铺满和透明度；不影响卡片、按钮、文字位置。</div>'+
        '<div style="margin-bottom:12px;">'+
          '<label class="xy-upload-btn">📁 上传背景<input type="file" accept="image/*" onchange="xyUploadBg(this.files[0])" style="display:none"></label> '+
          '<button class="xy-reset-btn" onclick="xyResetBg()">↺ 恢复粉色</button>'+
          (bgImg?'<span class="xy-tag-ok">● 已设置自定义背景</span>':'<span class="xy-tag-def">当前默认粉色背景</span>')+
        '</div>'+
        '<div style="margin-bottom:10px;">'+
          '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px">铺满方式</div>'+
          '<div class="xy-seg">'+modeBtn('tile','铺满平铺')+modeBtn('center','居中显示')+modeBtn('cover','全屏拉伸')+'</div>'+
        '</div>'+
        '<div>'+
          '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between"><span>透明度</span><span id="xyBgOpVal">'+bgOp+'%</span></div>'+
          '<input type="range" class="xy-range" min="10" max="100" value="'+bgOp+'" oninput="xySetBgOpacity(this.value)">'+
        '</div>'+
      '</div>'+

      '<div class="xy-card">'+
        '<h3>🎨 主题颜色</h3>'+
        '<div class="xy-desc">选一套现成配色，或自己调一个颜色；按钮、标题、进度圈、装饰元素全跟着变。</div>'+
        '<div style="font-size:12px;color:var(--ink-soft);margin:6px 0 8px">现成主题：</div>'+
        '<div class="xy-preset-grid">'+phtml+'</div>'+
        '<div style="margin-top:16px;">'+
          '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px">自己调颜色：</div>'+
          '<div class="xy-color-row">'+
            '<input type="color" value="'+(theme||'#e8485c')+'" onchange="xySetTheme(this.value)"> '+
            '<button class="xy-reset-btn" onclick="xyResetTheme()">↺ 恢复粉色</button>'+
            (theme?'<span class="xy-tag-ok">● 当前：'+theme+'</span>':'<span class="xy-tag-def">当前默认粉色</span>')+
          '</div>'+
        '</div>'+
      '</div>'+

      '<div class="xy-card" style="text-align:center">'+
        '<div class="xy-desc" style="margin-bottom:0">所有设置已自动保存在本机，刷新不丢。<br>换设备时去「系统设置」导出完整备份一起带走。</div>'+
      '</div>'+

      '</div>';
  };

  /* ---- 挂钩：原有 applyKittyImgs 跑完后补上自定义头像 ---- */
  if(typeof window.applyKittyImgs==='function'){
    var _origKitty=window.applyKittyImgs;
    window.applyKittyImgs=function(){ _origKitty.apply(this,arguments); applyAvatar(); };
  }

  /* ---- 初始化 ---- */
  captureDefault();
  applyAll();
})();
</script>

</body>
</html>
