<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="心怡工作台">
<meta name="theme-color" content="#fff0f3">
<title>个人专属工作台 · 全能仪表板</title>
  <link rel="icon" type="image/png" sizes="512x512" href="./app-icon.png">
  <link rel="apple-touch-icon" href="./app-icon.png">
  <link rel="manifest" href="./manifest.json">
<style>
  :root{
    /* Hello Kitty 主题色 */
    --bg1:#fff5f7; --bg2:#ffdee5; --bg3:#ffc2d1;
    --ink:#5a3d47; --ink-soft:#a37d8a; --ink-light:#d4b2bc;
    --line:#f8c8d4; --card:#fff8fa;
    --shadow:0 8px 24px rgba(232,72,92,.12);
    --shadow-deep:0 12px 32px rgba(232,72,92,.22);
    --radius:24px; --radius-sm:16px;
    --kitty-red:#e8485c; --kitty-red-dark:#c92e42;
    --kitty-pink:#ff85a2; --kitty-pink-soft:#ffb3c7;
    --kitty-yellow:#ffd666;
    --lav:#f3d9f7; --lav-deep:#c27fcf;
    --peach:#ffd1b8; --peach-deep:#f28e66;
    --blue:#bfe0ff; --blue-deep:#5a9fd4; --blue-dark:#3d7eb3;
    --yellow:#fff1c2; --yellow-deep:#f2b82e;
    --mint:#d4f5e0; --mint-deep:#5dbf7d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; overflow:hidden;
  }

  /* ===== Hello Kitty 装饰元素 ===== */
  .bow{
    position:absolute; width:40px; height:30px;
  }
  .bow::before,.bow::after{
    content:""; position:absolute; width:18px; height:24px; background:var(--kitty-red);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; border:2px solid var(--ink);
  }
  .bow::before{left:0; transform:rotate(-25deg)}
  .bow::after{right:0; transform:rotate(25deg)}
  .bow-cen{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:12px; height:12px; background:var(--kitty-red); border-radius:50%; border:2px solid var(--ink); z-index:1;
  }
  .heart-deco{position:absolute; color:var(--kitty-pink-soft); font-size:20px; opacity:.6; animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* ===== 锁屏 ===== */
  .lock-screen{
    position:fixed; inset:0; z-index:1000;
    background:linear-gradient(160deg,#fff0f3 0%,#ffd6e0 50%,#ffc2d1 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .lock-screen .heart-deco{position:absolute}
  .lock-card{
    background:rgba(255,255,255,.94); border-radius:32px; padding:44px 34px 38px;
    width:100%; max-width:380px; text-align:center; box-shadow:var(--shadow-deep);
    border:3px solid #fff; position:relative; overflow:hidden;
    animation:popIn .45s ease;
  }
  .lock-card::before{
    content:""; position:absolute; top:-30px; right:-30px; width:100px; height:100px;
    background:var(--kitty-pink-soft); border-radius:50%; opacity:.35;
  }
  .lock-card::after{
    content:""; position:absolute; bottom:-20px; left:-20px; width:80px; height:80px;
    background:var(--kitty-yellow); border-radius:50%; opacity:.3;
  }
  @keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .kitty-face{
    width:86px; height:70px; background:#fff; border-radius:45% 45% 42% 42%;
    margin:0 auto 18px; position:relative; border:3px solid var(--ink);
    box-shadow:0 6px 16px rgba(232,72,92,.2);
  }
  .kitty-face::before,.kitty-face::after{
    content:""; position:absolute; top:-2px; width:18px; height:22px; background:#fff;
    border:3px solid var(--ink); border-radius:50% 50% 0 0; z-index:-1;
  }
  .kitty-face::before{left:4px; transform:rotate(-15deg)}
  .kitty-face::after{right:4px; transform:rotate(15deg)}
  .kitty-eye{position:absolute; top:28px; width:9px; height:12px; background:var(--ink); border-radius:50%}
  .kitty-eye.l{left:24px} .kitty-eye.r{right:24px}
  .kitty-nose{position:absolute; top:38px; left:50%; transform:translateX(-50%); width:10px; height:7px; background:var(--kitty-yellow); border-radius:50%; border:2px solid var(--ink)}
  .kitty-whisk{position:absolute; top:36px; width:18px; height:2px; background:var(--ink); border-radius:2px}
  .kitty-whisk.l1{left:-12px; transform:rotate(8deg)} .kitty-whisk.l2{left:-12px; top:44px; transform:rotate(-5deg)}
  .kitty-whisk.r1{right:-12px; transform:rotate(-8deg)} .kitty-whisk.r2{right:-12px; top:44px; transform:rotate(5deg)}
  .kitty-bow{position:absolute; top:-8px; right:-6px; width:34px; height:26px}
  .kitty-bow::before,.kitty-bow::after{content:""; position:absolute; width:15px; height:20px; background:var(--kitty-red); border-radius:50%; border:2px solid var(--ink)}
  .kitty-bow::before{left:0; transform:rotate(-25deg)}
  .kitty-bow::after{right:0; transform:rotate(25deg)}
  .kitty-bow .cen{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:10px; height:10px; background:var(--kitty-red); border-radius:50%; border:2px solid var(--ink); z-index:1}

  .lock-card h2{font-size:23px; color:var(--kitty-red); margin-bottom:6px; letter-spacing:.5px; position:relative; z-index:1}
  .lock-card p{color:var(--ink-soft); font-size:14px; margin-bottom:24px; position:relative; z-index:1}
  .lock-card input{
    width:100%; border:2px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px;
    font-size:16px; text-align:center; letter-spacing:3px; outline:none; margin-bottom:16px;
    background:#fff; color:var(--ink); position:relative; z-index:1;
  }
  .lock-card input:focus{border-color:var(--kitty-red)}
  .lock-card button{
    width:100%; border:none; border-radius:var(--radius-sm); padding:14px;
    background:linear-gradient(135deg,var(--kitty-red),var(--kitty-red-dark));
    color:#fff; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(232,72,92,.35);
    transition:transform .15s; position:relative; z-index:1;
  }
  .lock-card button:active{transform:scale(.97)}
  .lock-hint{margin-top:18px; font-size:12px; color:var(--ink-soft); position:relative; z-index:1}
  .lock-error{color:var(--kitty-red); font-size:13px; margin-top:10px; min-height:18px; font-weight:600}
  .lock-card.shake{animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* ===== 应用布局 ===== */
  .app{display:flex; min-height:100vh; max-height:100vh}
  .sidebar{
    width:230px; flex:none; background:rgba(255,255,255,.82);
    border-right:1px solid var(--line); backdrop-filter:blur(10px);
    display:flex; flex-direction:column; padding:18px 12px 14px; overflow:hidden;
    transition:width .25s ease, opacity .2s ease, padding .25s ease;
  }
  .sb-head{text-align:center; margin-bottom:18px; padding-bottom:14px; border-bottom:2px dashed var(--line); position:relative}
  .sb-avatar{
    width:64px; height:52px; background:#fff; border-radius:45% 45% 42% 42%;
    display:flex; align-items:center; justify-content:center; margin:0 auto 10px;
    border:3px solid var(--ink); position:relative; box-shadow:0 4px 12px rgba(232,72,92,.2);
  }
  .sb-avatar .kitty-bow{top:-8px; right:-8px; transform:scale(.9)}
  .sb-title{font-size:16px; font-weight:800; color:var(--ink)}
  .sb-sub{font-size:11px; color:var(--ink-soft); margin-top:3px}
  .sb-nav{flex:1; overflow-y:auto; padding-right:2px}
  .sb-item{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:6px;
    border-radius:var(--radius-sm); border:none; background:transparent; color:var(--ink);
    font-size:14px; cursor:pointer; transition:.15s; text-align:left; font-family:inherit;
  }
  .sb-item:hover{background:rgba(255,133,162,.12)}
  .sb-item.active{background:linear-gradient(135deg,var(--kitty-pink),var(--kitty-red)); color:#fff; box-shadow:0 4px 14px rgba(232,72,92,.28)}
  .sb-item .ic{font-size:20px; width:26px; text-align:center}
  .sb-foot{padding-top:10px; border-top:2px dashed var(--line)}
  .sb-foot button{
    width:100%; padding:10px; border-radius:var(--radius-sm); border:none; background:#fff;
    color:var(--ink-soft); font-size:13px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:6px; font-family:inherit;
  }
  .sb-foot button:hover{background:rgba(255,133,162,.12); color:var(--kitty-red)}

  .main{flex:1; display:flex; flex-direction:column; min-width:0}
  .topbar{
    height:60px; background:rgba(255,255,255,.72); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 22px;
    backdrop-filter:blur(8px); flex:none;
  }
  .tb-left{display:flex; align-items:center; gap:12px}
  .tb-left .home-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.06); font-size:18px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; transition:.15s; border:2px solid var(--line);
  }
  .tb-left .home-btn:hover{transform:scale(1.05); border-color:var(--kitty-pink)}
  .tb-left span{font-size:17px; font-weight:800; color:var(--ink)}
  .tb-right{font-size:13px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:6px}
  .content{flex:1; overflow-y:auto; padding:22px 24px calc(20px + env(safe-area-inset-bottom))}
  .content::-webkit-scrollbar{width:6px}
  .content::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px}

  /* ===== 底部 Dock（移动端） ===== */
  .dock{
    display:none; position:fixed; left:0; right:0; bottom:0; height:68px;
    background:rgba(255,255,255,.94); border-top:1px solid var(--line);
    backdrop-filter:blur(12px); padding-bottom:env(safe-area-inset-bottom);
    justify-content:space-around; align-items:center; z-index:100;
  }
  .dock-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; border:none; background:transparent; color:var(--ink-soft); font-size:10px; cursor:pointer;
    height:100%; font-family:inherit;
  }
  .dock-item .ic{font-size:22px}
  .dock-item.active{color:var(--kitty-red)}
  .dock-more{position:fixed; right:12px; bottom:78px; z-index:101; display:none}
  .dock-more-btn{
    width:48px; height:48px; border-radius:50%; border:none; background:var(--kitty-red);
    color:#fff; font-size:22px; box-shadow:0 4px 14px rgba(232,72,92,.35); cursor:pointer;
  }
  .drawer{
    position:fixed; inset:0; z-index:200; display:none; align-items:flex-end;
    background:rgba(0,0,0,.25);
  }
  .drawer.show{display:flex}
  .drawer-pan{
    width:100%; max-height:70vh; background:#fff; border-radius:28px 28px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)); animation:up .25s ease;
  }
  .drawer-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .drawer-h b{font-size:16px}
  .drawer-close{width:32px; height:32px; border-radius:50%; border:none; background:var(--line); font-size:18px; cursor:pointer}
  .drawer-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .drawer-grid button{
    display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 4px;
    border-radius:var(--radius-sm); border:1px solid var(--line); background:#fff; font-size:11px;
    color:var(--ink); cursor:pointer; font-family:inherit;
  }
  .drawer-grid button .ic{font-size:22px}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}

  @media(max-width:760px){
    .sidebar{display:flex; width:120px; padding:12px 8px 10px}
    .sb-head{padding-bottom:10px; margin-bottom:12px}
    .sb-head .sb-avatar{width:46px; height:36px; border-width:2px; margin-bottom:6px}
    .sb-head .sb-avatar .kitty-bow{transform:scale(.65); top:-6px; right:-6px}
    .sb-title{font-size:12px}
    .sb-sub{font-size:9px}
    .sb-item{flex-direction:column; gap:4px; padding:10px 4px; font-size:11px; text-align:center; border-radius:12px}
    .sb-item .ic{font-size:22px; width:auto}
    .sb-foot button{font-size:10px; padding:8px 2px; gap:3px}
    .sb-foot button .ic{font-size:14px}
    .content{padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
    .dock{display:none}
    .dock-more{display:none}
    .topbar{padding:0 12px; height:54px}
    .tb-left span{font-size:14px}
    .tb-left .home-btn{width:34px; height:34px; font-size:16px}
  }
  @media(max-width:380px){
    .sidebar{width:72px; padding:10px 6px 8px}
    .sb-head .sb-avatar{display:none}
    .sb-title{font-size:11px}
    .sb-sub{display:none}
    .sb-item{padding:10px 2px; font-size:10px}
    .sb-item .sb-t{display:none}
    .sb-foot button{font-size:0; padding:8px 0}
    .sb-foot button .ic{font-size:15px}
  }

  /* ===== 侧边栏收起 / 展开悬浮按钮 ===== */
  .nav-fab{
    display:none; position:fixed; top:10px; left:10px; z-index:130;
    width:38px; height:38px; border-radius:50%; border:2px solid var(--line);
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.08); font-size:18px;
    align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .nav-fab:hover{border-color:var(--kitty-pink)}
  .app.collapsed .sidebar{width:0 !important; min-width:0; padding-left:0; padding-right:0; border-right:none; opacity:0; pointer-events:none}
  .app.collapsed .nav-fab{display:flex}
  .app.collapsed .tb-left .home-btn{display:none}

  /* ===== 通用卡片与按钮 ===== */
  .page-title{font-size:22px; font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:8px}
  .page-desc{color:var(--ink-soft); font-size:13px; margin-bottom:18px}
  .card-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
  @media(max-width:560px){.card-grid{grid-template-columns:1fr}}
  .dash-card{
    background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);
    border:1px solid var(--line); transition:transform .2s, box-shadow .2s; position:relative; overflow:hidden;
  }
  .dash-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-deep)}
  .dash-card .h{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .dash-card .h b{font-size:15px; display:flex; align-items:center; gap:6px}
  .dash-card .n{font-size:28px; font-weight:800; color:var(--kitty-red)}
  .dash-card .sub{font-size:12px; color:var(--ink-soft); margin-top:4px}

  /* ===== 首页核心进度环 ===== */
  .ring-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
  @media(min-width:720px){.ring-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.ring-grid{grid-template-columns:repeat(2,1fr)}}
  .ring-card{
    background:var(--card); border-radius:var(--radius); padding:16px 14px 14px;
    box-shadow:var(--shadow); border:1px solid var(--line); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
    transition:transform .2s, box-shadow .2s;
  }
  .ring-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-deep)}
  .ring-card .rc-t{font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px}
  .ring-card .rc-s{font-size:11px; color:var(--ink-soft)}
  .ring-wrap{position:relative; width:88px; height:88px}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-bg{fill:none; stroke:var(--line); stroke-width:9}
  .ring-fg{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .6s ease}
  .ring-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:var(--ink)}
  .ring-num small{font-size:10px; color:var(--ink-soft); font-weight:600}

  /* ===== 首页"全部模块"网格 ===== */
  .allmod-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  @media(min-width:720px){.allmod-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:560px){.allmod-grid{grid-template-columns:repeat(3,1fr)}}
  .allmod{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 8px 10px;
    display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  .allmod:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
  .allmod .am-ic{font-size:24px}
  .allmod .am-t{font-size:12px; font-weight:700; color:var(--ink)}
  .allmod .am-s{font-size:10px; color:var(--ink-soft); text-align:center; line-height:1.3}
  .btn{
    border:none; border-radius:var(--radius-sm); padding:10px 16px; font-size:14px;
    font-weight:700; cursor:pointer; font-family:inherit; transition:.15s; display:inline-flex;
    align-items:center; justify-content:center; gap:5px;
  }
  .btn:active{transform:scale(.97)}
  .btn-red{background:linear-gradient(135deg,var(--kitty-red),var(--kitty-red-dark)); color:#fff; box-shadow:0 4px 14px rgba(232,72,92,.3)}
  .btn-pink{background:linear-gradient(135deg,var(--kitty-pink),var(--kitty-red)); color:#fff; box-shadow:0 4px 14px rgba(232,72,92,.25)}
  .btn-soft{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .btn-blue{background:linear-gradient(135deg,var(--blue-deep),var(--blue-dark)); color:#fff; box-shadow:0 4px 14px rgba(90,159,212,.3)}
  .btn-green{background:linear-gradient(135deg,var(--mint-deep),#4aa86a); color:#fff}
  .sec-title{
    font-size:13px; font-weight:700; color:var(--kitty-red); display:flex; align-items:center; gap:6px;
    margin:20px 0 10px; text-transform:none;
  }
  .sec-title::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--kitty-red)}

  /* ===== 组件样式 ===== */
  .task{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:9px; cursor:pointer}
  .task .box{width:24px; height:24px; border-radius:8px; border:2px solid var(--line); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:14px; transition:.15s; background:#fff}
  .task.done .box{background:var(--kitty-red); border-color:var(--kitty-red); color:#fff}
  .task.done .txt{text-decoration:line-through; color:var(--ink-soft)}
  .task .txt{flex:1; font-size:14.5px}
  .task .del{background:none; border:none; color:#d4b2bc; font-size:18px; cursor:pointer}
  .add{display:flex; gap:8px; margin-top:6px}
  .add input{flex:1; border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 13px; font-size:14px; outline:none; font-family:inherit}
  .add input:focus{border-color:var(--kitty-red)}
  .add button{background:var(--kitty-red); color:#fff; border:none; border-radius:var(--radius-sm); padding:0 18px; font-weight:700; cursor:pointer; font-family:inherit}
  details.adv{background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-top:16px}
  details.adv summary{cursor:pointer; font-weight:700; font-size:14px; color:var(--ink); list-style:none; outline:none}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary::before{content:"▸ "; color:var(--kitty-red); font-weight:800}
  details.adv[open] summary::before{content:"▾ "}
  .bk{color:var(--kitty-red); cursor:pointer; font-weight:700; text-decoration:none; border-bottom:1px dashed var(--kitty-red)}

  .habits{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:6px}
  .dot{width:32px; height:32px; border-radius:10px; background:#fff; display:flex; align-items:center;
    justify-content:center; font-size:13px; color:var(--ink-soft); cursor:pointer; border:1px solid var(--line)}
  .dot.on{background:var(--kitty-red); color:#fff; border-color:var(--kitty-red)}

  .counter{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:14px; margin-bottom:9px}
  .counter .big{font-size:32px; font-weight:800; color:var(--kitty-red); min-width:60px; text-align:center}
  .counter .lab{flex:1; font-size:14px}
  .counter button{width:38px; height:38px; border-radius:12px; border:none; font-size:20px; font-weight:800; cursor:pointer}

/* ===== 衣橱增强（滑动 + 人体预览） ===== */
.fit-preview{position:relative;background:linear-gradient(160deg,#ffd9e6,#ffeef4);border-radius:18px;padding:14px;margin-bottom:14px;overflow:hidden}
.fit-preview::after{content:"👗";position:absolute;right:-6px;top:-6px;font-size:54px;opacity:.12}
.fit-body{position:relative;width:150px;height:300px;margin:4px auto 0}
.fit-sil{position:absolute;background:rgba(255,255,255,.5);border:2px solid #ffb8cd}
.fit-head{width:46px;height:46px;border-radius:50%;left:52px;top:2px}
.fit-torso{width:78px;height:104px;border-radius:34px 34px 14px 14px;left:36px;top:54px}
.fit-legL,.fit-legR{width:30px;height:104px;border-radius:8px 8px 12px 12px;top:158px}
.fit-legL{left:46px}.fit-legR{left:74px}
.fit-footL,.fit-footR{width:36px;height:18px;border-radius:8px;top:262px}
.fit-footL{left:42px}.fit-footR{left:72px}
.fit-layer{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.10)}
.fit-top{top:52px;width:82px;height:108px}
.fit-bottom{top:156px;width:70px;height:106px}
.fit-shoe{top:258px;width:44px;height:26px;border-radius:12px}
.fit-layer img{width:100%;height:100%;object-fit:cover}
.fit-layer .ph{font-size:30px}
.fit-name{text-align:center;font-size:13px;font-weight:700;margin-top:8px}
.fit-tip{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:2px}
.fit-actions{display:flex;gap:8px;margin-top:10px}
.fit-actions button{flex:1}
.ward-sec{margin-top:8px}
.ward-sec-h{font-size:14px;font-weight:700;margin:10px 2px 6px;display:flex;align-items:center;gap:6px}
.ward-track{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ward-track::-webkit-scrollbar{display:none}
.ward-card{position:relative;flex:0 0 auto;width:108px;scroll-snap-align:start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;cursor:pointer;transition:.12s}
.ward-card.on{border-color:var(--kitty-red);box-shadow:0 0 0 3px rgba(232,72,92,.18)}
.ward-card .ward-img,.ward-card .ward-ph{width:100%;height:98px;border-radius:10px;object-fit:cover;background:#f3ede0;display:flex;align-items:center;justify-content:center;font-size:34px}
.wi-name{font-size:12px;font-weight:600;margin-top:5px;line-height:1.3}
.wi-sub{font-size:11px;color:var(--ink-soft)}
.ward-add-card{flex:0 0 auto;width:108px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line);border-radius:14px;color:var(--ink-soft);font-size:12px;cursor:pointer;background:#fffdf9;min-height:140px}


/* ===== 首页 hero（问候 / 大时钟 / 语录） ===== */
.hero{background:linear-gradient(135deg,#fff,#fff0f4);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:16px;box-shadow:0 6px 18px rgba(232,72,92,.08);position:relative;overflow:hidden}
.hero .hello{font-size:14px;color:var(--kitty-red);font-weight:700}
.hero .bigtime{font-size:46px;font-weight:800;letter-spacing:1px;line-height:1.05;margin:2px 0;background:linear-gradient(90deg,var(--kitty-red),var(--kitty-pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .date{font-size:13px;color:var(--ink-soft)}
.hero .quote{margin-top:12px;background:rgba(255,255,255,.7);border-left:4px solid var(--kitty-pink);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6}
.hero .quote .cn{font-weight:600}
.hero .quote .en{display:block;margin-top:3px;color:var(--ink-soft);font-style:italic}
.hero .kitty-deco{position:absolute;right:14px;top:8px;font-size:46px;opacity:.85}

/* ===== 连接状态标识 ===== */
.net-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid}
.net-status.on{color:#2e9e5b;background:rgba(46,158,91,.12);border-color:rgba(46,158,91,.4)}
.net-status.off{color:#c0392b;background:rgba(192,57,43,.1);border-color:rgba(192,57,43,.35)}
.net-status .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor}
.net-status.on .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,158,91,.5)}70%{box-shadow:0 0 0 6px rgba(46,158,91,0)}100%{box-shadow:0 0 0 0 rgba(46,158,91,0)}}

/* ===== 自媒体 / 通用标签 ===== */
.media-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.media-tabs::-webkit-scrollbar{display:none}
.media-tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.media-tab.on{background:var(--kitty-red);color:#fff;border-color:var(--kitty-red)}
.insp-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.insp-card .it{font-weight:700;display:flex;align-items:center;gap:6px}
.insp-card .ir{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
.insp-card .im{font-size:12px;color:var(--kitty-red);margin-top:6px}
.insp-card .ia{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tagpill{font-size:11px;background:var(--kitty-pink-soft);color:var(--kitty-red);border-radius:10px;padding:2px 8px;font-weight:700}

/* ===== 卡卡小狗 ===== */
.kaka-hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fff,#fff3e9);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.kaka-face{width:64px;height:64px;flex:none}
.kaka-name{font-size:18px;font-weight:800}
.kaka-sub{font-size:12px;color:var(--ink-soft)}
.kaka-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kaka-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kaka-stat .ki{font-size:24px}
.kaka-stat .kv{font-size:12px;color:var(--ink-soft);margin-top:4px}
.kaka-stat .kt{font-size:13px;font-weight:700;margin-top:2px}
.kaka-emoji{font-size:30px;text-align:center;margin:4px 0}
.kaka-moment{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;align-items:center}
.kaka-moment img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.kaka-mood{display:flex;gap:6px;flex-wrap:wrap}
.kaka-mood .chip{flex:1 1 auto;text-align:center}

/* ===== 今日短篇 ===== */
.short-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.short-card h3{font-size:16px;margin-bottom:6px}
.short-card .meta{font-size:12px;color:var(--ink-soft);margin-bottom:10px}
.short-card .body{font-size:14px;line-height:1.8}
.short-read{font-size:12px;color:#2e9e5b;font-weight:700;margin-top:8px}

/* ===== 天气穿搭 ===== */
.weather-box{background:linear-gradient(135deg,#e8f4ff,#f3fbff);border:1px solid #cfe6ff;border-radius:16px;padding:14px;margin-bottom:14px}
.weather-top{display:flex;align-items:center;gap:12px}
.weather-temp{font-size:34px;font-weight:800;color:#2b6cb0}
.weather-info{font-size:13px;color:#3a5a78;line-height:1.5}
.weather-tip{margin-top:10px;background:#fff;border-radius:12px;padding:10px;font-size:13px;line-height:1.6;color:var(--ink)}
.weather-input{display:flex;gap:8px;margin-top:10px}
.weather-input input{flex:1}

/* ===== 视频一键跳转 ===== */
.vid-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--kitty-red);color:var(--kitty-red);background:#fff;cursor:pointer;text-decoration:none}
.vid-btn:hover{background:var(--kitty-red);color:#fff}
.vid-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ===== 历史折叠 ===== */
.history-sec{margin-top:16px}
.hist-day{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-weight:700}
.hist-day .cnt{font-size:11px;color:var(--ink-soft);font-weight:500}
.hist-day .arrow{margin-left:auto;transition:.2s;color:var(--ink-soft)}
.hist-day.open .arrow{transform:rotate(90deg)}
.hist-body{display:none;padding:0 4px 8px}
.hist-body.open{display:block}

/* ===== 旅行足迹 ===== */
.travel-sum{display:flex;gap:10px;margin-bottom:16px}
.travel-sum>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.travel-sum b{display:block;font-size:22px;color:var(--kitty-red)}
.travel-sum span{font-size:12px;color:var(--ink-soft)}
.travel-form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
.travel-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.travel-form textarea{min-height:64px;margin-bottom:8px;resize:vertical}
.travel-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.travel-head{display:flex;align-items:center;justify-content:space-between}
.travel-city{font-size:18px;font-weight:800;color:var(--ink)}
.travel-meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.travel-meta span{font-size:12px;background:#fff0f3;color:var(--kitty-red);border-radius:14px;padding:3px 10px}
.travel-text{font-size:13px;line-height:1.7;color:var(--ink);background:#fff7f9;border-left:3px solid var(--kitty-red);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.tr-cat{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.tr-cat-h{font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tr-cnt{font-size:11px;color:var(--ink-soft);background:#f3eef0;border-radius:10px;padding:1px 8px;font-weight:500}
.tr-items{display:flex;flex-direction:column;gap:8px}
.tr-item{display:flex;gap:10px;align-items:flex-start}
.tr-img{width:62px;height:62px;border-radius:12px;object-fit:cover;cursor:zoom-in;border:1px solid var(--line);flex-shrink:0}
.tr-img-empty{display:flex;align-items:center;justify-content:center;font-size:24px;background:#f6f2f4;color:#cbb3bb}
.tr-item-b{flex:1;min-width:0}
.tr-item-name{font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stars{color:#f6a623;font-size:12px;letter-spacing:1px}
.tr-item-text{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:2px 0 4px}
.tr-del{font-size:11px;color:#c97b8a;border:none;background:none;cursor:pointer;padding:0;text-decoration:underline}
.tr-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tr-add input[type=text],.tr-add input:not([type=file]):not([type=date]){flex:1;min-width:90px}
.tr-text-in{flex:1;min-width:110px}
.tr-file{font-size:13px;background:#fff0f3;color:var(--kitty-red);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center}
.tr-file input{display:none}
.tr-rate{border-radius:10px;border:1px solid var(--line);padding:7px;font-size:12px;color:var(--ink)}
.tr-addbtn{white-space:nowrap;padding:7px 12px}
.imgzoom{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out}
.imgzoom img{max-width:92%;max-height:92%;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}

/* ===== 回顾报告 ===== */
.report-tabs{display:flex;gap:8px;margin-bottom:14px}
.report-tab{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:#fff;border:1px solid var(--line);color:var(--ink);transition:.15s}
.report-tab.on{background:linear-gradient(135deg,var(--kitty-pink),var(--kitty-red));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(232,72,92,.25)}
.report-hero{background:linear-gradient(135deg,#fff7df,#ffeede);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--line);text-align:center}
.report-period{font-size:20px;font-weight:800;color:var(--ink)}
.report-quote{font-size:12px;color:var(--ink-soft);margin-top:6px}
.report-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.report-bar-row b{min-width:60px;text-align:right;font-size:13px;color:var(--ink)}
.report-bar{flex:1;height:12px;background:#f0ebee;border-radius:6px;overflow:hidden}
.report-bar-fill{height:100%;background:linear-gradient(90deg,var(--kitty-pink),var(--kitty-red));border-radius:6px;transition:width .5s ease}
.report-tips{display:flex;flex-direction:column;gap:8px}
.report-tip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}

/* ===== 全局搜索 ===== */
.search-toggle-btn{width:36px;height:36px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;border:2px solid var(--line)}
.search-toggle-btn:hover{border-color:var(--kitty-pink);transform:scale(1.05)}
.global-search{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;flex:none;box-shadow:0 4px 12px rgba(232,72,92,.08)}
.search-box{display:flex;gap:8px;align-items:center}
.search-box input{flex:1;border:2px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;outline:none;font-family:inherit;background:#fff;color:var(--ink)}
.search-box input:focus{border-color:var(--kitty-pink)}
.search-close{width:34px;height:34px;border-radius:50%;border:none;background:var(--line);font-size:15px;cursor:pointer;color:var(--ink);flex:none}
#globalSearchResults{max-height:300px;overflow-y:auto;margin-top:8px}
.search-count{font-size:12px;color:var(--ink-soft);padding:4px 2px 8px}
.search-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:.12s}
.search-item:hover{background:rgba(255,133,162,.1)}
.search-ic{font-size:20px;width:30px;text-align:center;flex:none}
.search-title{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 旅行足迹地图 ===== */
.travel-map{position:relative;background:linear-gradient(135deg,#e8f4ff,#f0f8ff);border:1px solid var(--line);border-radius:var(--radius);height:180px;overflow:hidden;padding:12px}
.map-outline{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#c8d9e5;font-weight:700;letter-spacing:2px}
.map-pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2;cursor:pointer}
.map-pin-dot{width:12px;height:12px;background:var(--kitty-red);border-radius:50%;box-shadow:0 0 0 3px rgba(232,72,92,.2);border:2px solid #fff}
.map-pin-label{font-size:9px;color:var(--kitty-red-dark);font-weight:700;background:#fff;border-radius:8px;padding:1px 4px;margin-top:2px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ===== 心情日记 ===== */
.mood-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;font-size:24px;cursor:pointer;font-family:inherit;transition:.15s}
.mood-btn span{font-size:10px;color:var(--ink-soft)}
.mood-btn.on{border-color:var(--kitty-red);background:#fff0f3;box-shadow:0 2px 10px rgba(232,72,92,.2)}
.mood-btn.on span{color:var(--kitty-red);font-weight:700}
.mood-entry{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}

/* ===== 旅行天气联动 ===== */
.travel-weather-tip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--ink);margin-bottom:8px}

@media(max-width:560px){
  .mood-picker{grid-template-columns:repeat(4,1fr)}
  .report-tab{font-size:13px;padding:10px 6px}
}

<style id="xyThemeCSS">
#xyBg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .3s;opacity:0;}
.xy-panel{max-width:680px;margin:0 auto;}
.xy-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
.xy-card h3{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.xy-desc{font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6;}
.xy-avatar-preview{width:80px;height:80px;border-radius:50%;border:3px solid var(--kitty-red);object-fit:cover;background:#fff;box-shadow:var(--shadow);}
.xy-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.xy-swatch{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink-light);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:transform .15s;}
.xy-swatch:hover{transform:scale(1.1);}
.xy-swatch.sel{border:3px solid var(--kitty-red);transform:scale(1.12);}
.xy-color-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
input[type=color]{width:52px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;padding:2px;}
.xy-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.xy-seg button{border:none;background:#fff;color:var(--ink-soft);padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
.xy-seg button.sel{background:var(--kitty-red);color:#fff;}
.xy-preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
.xy-upload-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--kitty-pink);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.xy-upload-btn:hover{background:var(--kitty-red);}
.xy-reset-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:inherit;}
.xy-range{width:100%;accent-color:var(--kitty-red);}
.xy-tag-ok{font-size:12px;color:var(--mint-deep);margin-left:6px;}
.xy-tag-def{font-size:12px;color:var(--ink-soft);margin-left:6px;}
@media(max-width:600px){.xy-preset-grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<div id="xyBg"></div>
<!-- 锁屏层 -->
<div id="lockScreen" class="lock-screen">
  <div class="heart-deco" style="top:12%;left:10%">💖</div>
  <div class="heart-deco" style="top:20%;right:12%;animation-delay:.5s">🎀</div>

<script>
const NAME="心怡";
const today=new Date();
const keyDate=today.toISOString().slice(0,10);
const wk=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const wkShort=["日","一","二","三","四","五","六"];

/* ---- storage helpers ---- */
var SYNC_READY=false, SYNC_TIMER=null, SYNC_PENDING=false;  /* 云同步开关（置于 DB 之前，避免 TDZ） */
var SYNC_PULL_TIMER=null, SYNC_PULL_INTERVAL=30000;          /* 自动拉取轮询 */
const MTIME_KEY='xinyi_mtimes_v1';                            /* 字段级修改时间 */

const DB=(()=>{
  const K="xinyi_workbench_v2";
  const isDateKey=k=>/^\d{4}-\d{2}-\d{2}$/.test(k);
  let d={};
  try{ d=JSON.parse(localStorage.getItem(K)||"{}")||{}; }catch(e){ d={}; }
  if(!Object.keys(d).length){
    try{
      const old=JSON.parse(localStorage.getItem("xinyi_workbench_v1")||"{}")||{};
      if(old && typeof old==='object'){
        if(Object.keys(old).length && Object.keys(old).every(k=>isDateKey(k))){
          Object.keys(old).sort().forEach(day=>{ if(old[day]&&typeof old[day]==='object') Object.assign(d, old[day]); });
        } else { d=old; }
        localStorage.setItem(K,JSON.stringify(d));
        localStorage.removeItem("xinyi_workbench_v1");
      }
    }catch(e){}
  }
  /* 字段级修改时间：每个 key 独立 mtime，用于多设备合并 */
  let mt={};
  try{ mt=JSON.parse(localStorage.getItem(MTIME_KEY)||"{}")||{}; }catch(e){ mt={}; }
  const loadMt=()=>{ try{ mt=JSON.parse(localStorage.getItem(MTIME_KEY)||"{}")||{}; }catch(e){ mt={}; } };
  const saveMt=()=>localStorage.setItem(MTIME_KEY, JSON.stringify(mt));
  const touch=(p)=>{ mt[p]=Date.now(); saveMt(); };
  const getMt=(p)=> mt[p]||0;
  const setMt=(p,t)=>{ mt[p]=t; saveMt(); };
  const mergeMt=(incoming)=>{ for(const k in incoming){ if((mt[k]||0)<incoming[k]){ mt[k]=incoming[k]; } } saveMt(); };
  const save=()=>localStorage.setItem(K,JSON.stringify(d));
  return { key:K, d, save,
    get:(p,def)=> (p in d ? d[p] : def),
    set:(p,v)=>{ d[p]=v; save(); touch(p); scheduleSync(); },
    all:()=>d, raw:()=>JSON.stringify(d,null,2),
    reload:()=>{ try{ d=JSON.parse(localStorage.getItem(K)||"{}")||{}; }catch(e){ d={}; } loadMt(); },
    /* 字段级时间 API（用于云端合并） */
    mtimes:()=>{ loadMt(); return Object.assign({}, mt); },
    getMt, setMt, mergeMt, touch };
})();

const BODY_KEY='xinyi_body_log';
function bodyLog(){ try{return JSON.parse(localStorage.getItem(BODY_KEY))||[];}catch(e){return [];} }
function setBodyLog(a){ localStorage.setItem(BODY_KEY,JSON.stringify(a)); localStorage.setItem(MTIME_KEY+':body', String(Date.now())); scheduleSync(); }
function bodyMtime(){ return Number(localStorage.getItem(MTIME_KEY+':body')||0); }
function setBodyMtime(t){ localStorage.setItem(MTIME_KEY+':body', String(t)); }

/* ---- password lock (哈希存储，不再明文) ---- */
const PWD_KEY='xinyi_pwd';
const PWD_META='xinyi_pwd_meta';      // 存 {salt, iter, ver}
let _tryCount=0, _lockUntil=0;         // 简单防爆破

/* SHA-256 哈希（Web Crypto，纯浏览器，无额外依赖） */
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* 加盐迭代哈希：salted = sha256(salt + pwd)，重复 N 次提高成本 */
async function hashPwd(pwd, salt, iter=2000){
  let h = salt + '::' + pwd;
  for(let i=0;i<iter;i++) h = await sha256(h);
  return h;
}
/* 读取当前密码哈希与元数据 */
function getPwdRec(){
  try{ const m=JSON.parse(localStorage.getItem(PWD_META)||'{}'); return {salt:m.salt||'', iter:m.iter||2000, ver:m.ver||2}; }catch(e){ return {salt:'',iter:2000,ver:2}; }
}
async function verifyPwd(input){
  const rec=getPwdRec();
  if(rec.salt){ return (await hashPwd(input, rec.salt, rec.iter))===localStorage.getItem(PWD_KEY); }
  return false;
}
async function setPwdRec(np){
  const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const iter = 2000;
  const h = await hashPwd(np, salt, iter);
  localStorage.setItem(PWD_KEY, h);
  localStorage.setItem(PWD_META, JSON.stringify({salt, iter, ver:2}));
}
async function initLock(){
  // 老版本：若存在明文密码且无元数据，自动迁移为哈希存储
  const oldRaw=localStorage.getItem(PWD_KEY);
  if(oldRaw && !localStorage.getItem(PWD_META)){ await setPwdRec(oldRaw); }
  if(!localStorage.getItem(PWD_KEY)){ await setPwdRec('cxydgzt0113'); }
  if(sessionStorage.getItem('xinyi_unlocked')==='1') showApp();
  setInterval(tickClock,1000);
  if('serviceWorker' in navigator){
    // 带时间戳参数绕过 sw.js 的 HTTP 缓存，确保每次部署后能检测到新 Service Worker
    navigator.serviceWorker.register('./sw.js?v='+Date.now()).then(reg=>{
      // 发现新版本立即接管，避免用户停留在旧页面
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(nw){ nw.addEventListener('statechange',()=>{ if(nw.state==='activated'){ console.log('工作台已更新'); } }); }
      });
    }).catch(()=>{});
  }
}
async function unlock(){
  const input=document.getElementById('pwdIn').value;
  if(!input) return;
  const now=Date.now();
  if(now<_lockUntil){ document.getElementById('lockErr').textContent='尝试太频繁，请稍后再试～'; return; }
  const ok=await verifyPwd(input);
  if(ok){ _tryCount=0; sessionStorage.setItem('xinyi_unlocked','1'); showApp(); }
  else {
    _tryCount++;
    if(_tryCount>=5){ _lockUntil=now+30000; _tryCount=0;
      document.getElementById('lockErr').textContent='错误次数过多，锁定 30 秒 🔒'; }
    else { document.getElementById('lockErr').textContent=`密码不对哦，再试一次～（已错 ${_tryCount}/5）`; }
    const card=document.getElementById('lockCard');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    document.getElementById('pwdIn').value='';
  }
}

async function changePwd(){
  const old=document.getElementById('opwd').value;
  const np1=document.getElementById('npwd1').value;
  const np2=document.getElementById('npwd2').value;
  const okOld=await verifyPwd(old);
  if(!okOld){ alert('旧密码不正确'); return; }
  if(!np1){ alert('新密码不能为空'); return; }
  if(np1.length<4){ alert('新密码至少 4 位'); return; }
  if(np1!==np2){ alert('两次新密码不一致'); return; }
  await setPwdRec(np1);
  document.getElementById('opwd').value=''; document.getElementById('npwd1').value=''; document.getElementById('npwd2').value='';
  alert('密码已修改并加密保存，下次解锁生效 ✓');
}

/* ===== 云端自动同步（自托管，零配置） ===== */
/* 同步码即云端"密钥"，不当明文裸存：用本地盐做可逆混淆，避免一眼读出 */
const _SYNC_SALT='xinyi:local:obf:1:';
function _obf(s){
  try{ return btoa(_SYNC_SALT + s); }catch(e){ return s; }
}
/* ---- 云同步后端: textdb.online 免费云存储(GitHub Pages 无后端,改用公共KV服务) ---- */
const CLOUD_BASE='https://textdb.online/';
const CLOUD_MAX_CHARS=190000; /* 服务上限20万字符,留安全余量 */
function cloudKey(c){ return 'xywb-'+String(c||'').trim().toLowerCase(); }
function _deobf(s){
  try{ const d=atob(s); return d.startsWith(_SYNC_SALT)? d.slice(_SYNC_SALT.length) : s; }catch(e){ return s; }
}
function syncCode(){
  let c=localStorage.getItem('sync_code');
  if(c && !c.startsWith(_SYNC_SALT)){ return _deobf(c); }           // 已是混淆值
  if(!c){ c='xinyi-'+Math.random().toString(36).slice(2,10); localStorage.setItem('sync_code',_obf(c)); return c; }
  return _deobf(c);
}
function setSyncCode(v){
  localStorage.setItem('sync_code', _obf(v.trim()));
  localStorage.setItem('sync_local_ts','0');
}
function setNet(state, label){
  const el=document.getElementById('netStatus'), t=document.getElementById('netTxt');
  if(!el) return;
  let cls='net-status ', txt='未连接';
  if(state==='on'){ cls+='on'; txt='已同步 · 云端'; }
  else if(state==='busy'){ cls+='on'; txt='同步中…'; }
  else if(state==='off'){ cls+='off'; txt='同步失败'; }
  else { cls+='off'; txt='未连接'; }
  if(label) txt=label;
  el.className=cls; if(t) t.textContent=txt;
}
function snapshot(){
  return {
    main: { v:DB.all(), m:DB.mtimes() },
    body: { v:bodyLog(), m:bodyMtime() },
    goods:{ v:goodsLog(), m:goodsMtime() },
    ledger:{ v:ledgerLog(), m:ledgerMtime() },
    mood: { v:moodLog(), m:moodMtime() }
  };
}
/* 兼容旧 payload（直接 {main, body, goods, ledger} 无 v/m 包装） */
function _wrapPart(p){
  if(p==null) return null;
  if(p && typeof p==='object' && 'v' in p) return p;
  return { v:p, m:0 };
}
/* 应用云端快照（已按 mtime 合并后的版本） */
function applySnapshot(d){
  if(!d) return;
  const m=_wrapPart(d.main), b=_wrapPart(d.body), g=_wrapPart(d.goods), l=_wrapPart(d.ledger), md=_wrapPart(d.mood);
  let changed=false;
  if(m && m.v){
    localStorage.setItem(DB.key, JSON.stringify(m.v));
    if(m.m){ /* 按字段合并 mtime：仅当云端某 key 的 mtime 更新时采纳 */
      const localMt=DB.mtimes();
      const merged=Object.assign({}, localMt);
      for(const k in m.m){ if((merged[k]||0) < m.m[k]){ merged[k]=m.m[k]; } }
      for(const k of Object.keys(merged)){
        if(!(k in (m.m||{})) && (merged[k]||0) < (localMt[k]||0)){ merged[k]=localMt[k]; }
      }
      for(const k in merged){ if(merged[k]) DB.setMt(k, merged[k]); }
    }
    changed=true;
  }
  if(b && b.v && (b.m||0) >= bodyMtime()){ setBodyLog(b.v); if(b.m) setBodyMtime(b.m); changed=true; }
  if(g && g.v && (g.m||0) >= goodsMtime()){ setGoodsLog(g.v); if(g.m) setGoodsMtime(g.m); changed=true; }
  if(l && l.v && (l.m||0) >= ledgerMtime()){ setLedgerLog(l.v); if(l.m) setLedgerMtime(l.m); changed=true; }
  if(md && md.v && (md.m||0) >= moodMtime()){ setMoodLog(md.v); if(md.m) setMoodMtime(md.m); changed=true; }
  DB.reload();
  if(changed && typeof setRoute==='function') setRoute(currentRoute);
}
/* 拉取并按 mtime 合并：不直接覆盖，对每个分区取较新者 */
async function cloudPull(force){
  const code=syncCode();
  try{
    const r=await fetch(CLOUD_BASE+encodeURIComponent(cloudKey(code)),{cache:'no-store'});
    const t=await r.text();
    if(!t.trim()){ setNet('on','已连接 · 云端'); return 'empty'; }
    const j=JSON.parse(t);
    if(!j || !j.payload){ setNet('on','已连接 · 云端'); return 'empty'; }
    const d=j.payload||{};
    const localTs=Number(localStorage.getItem('sync_local_ts')||0);
    const cloudTs=Number(j.updated_at||0);
    if(force || localTs===0 || cloudTs>localTs){
      applySnapshot(d);
      localStorage.setItem('sync_local_ts', String(Math.max(cloudTs, Math.floor(Date.now()/1000))));
    }
    setNet('on');
    return true;
  }catch(e){ setNet('off'); return false; }
}
async function cloudPush(){
  const code=syncCode();
  try{
    setNet('busy');
    const body=JSON.stringify({payload:snapshot(),updated_at:Math.floor(Date.now()/1000)});
    if(body.length>CLOUD_MAX_CHARS){ setNet('off'); if(!window._sizeWarned){ window._sizeWarned=1; alert('数据快到云端容量上限了(20万字符),请在设置里导出备份一份!'); } return; }
    const r=await fetch(CLOUD_BASE+'update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({key:cloudKey(code),value:body})});
    const j=await r.json();
    if(!j.status){ setNet('off'); return; }
    localStorage.setItem('sync_local_ts', String(Math.floor(Date.now()/1000)));
    localStorage.setItem('sync_time', new Date().toLocaleString());
    setNet('on');
  }catch(e){ setNet('off'); }
}
function scheduleSync(){
  if(!SYNC_READY) return;
  SYNC_PENDING=true;
  if(SYNC_TIMER) clearTimeout(SYNC_TIMER);
  SYNC_TIMER=setTimeout(()=>{ SYNC_PENDING=false; cloudPush(); }, 1200);
}
/* 自动拉取：让开着的工作台也能看到另一台设备的更新 */
function startAutoPull(){
  if(SYNC_PULL_TIMER) return;
  const en=localStorage.getItem('xinyi_auto_pull');
  if(en==='0') return;
  SYNC_PULL_TIMER=setInterval(async ()=>{
    if(!SYNC_READY) return;
    if(document.hidden) return;   /* 标签不可见时不打扰 */
    if(SYNC_PENDING) return;      /* 本地有改动待 push，先不打断 */
    await cloudPull(false);
  }, SYNC_PULL_INTERVAL);
}
function setAutoPull(on){
  localStorage.setItem('xinyi_auto_pull', on?'1':'0');
  if(SYNC_PULL_TIMER){ clearInterval(SYNC_PULL_TIMER); SYNC_PULL_TIMER=null; }
  if(on) startAutoPull();
}
function isAutoPullOn(){ return localStorage.getItem('xinyi_auto_pull')!=='0'; }
async function cloudForcePull(){ await cloudPull(true); }
function saveSyncCode(){
  const v=(document.getElementById('syncCode').value||'').trim();
  if(!v){ alert('同步码不能为空'); return; }
  setSyncCode(v);
  SYNC_READY=false;
  syncStart();

}
function copySyncCode(){
  const c=syncCode();
  try{ navigator.clipboard.writeText(c); }catch(e){}
  alert('同步码已复制：'+c+'\n在另一台设备填一样的即可同步 ✓');
}
function netStateText(){ const t=document.getElementById('netTxt'); return t?t.textContent:'未连接'; }
async function syncStart(){
  try{
    const r=await fetch(CLOUD_BASE+encodeURIComponent(cloudKey(code)),{cache:'no-store'});
    if(!r.ok) throw 0;
    setNet('on','已连接 · 云端');
    const res=await cloudPull(false);
    if(res==='empty'){ await cloudPush(); }
    SYNC_READY=true;
    startAutoPull();
  }catch(e){ setNet('off'); SYNC_READY=true; startAutoPull(); }
}

/* ===== backup / sync ===== */
const SYNC_PREFIX="XINYI1::";
function exportAll(){
  const data={ _app:"xinyi-workbench", _ver:2, _time:new Date().toISOString(), main:DB.all(), body:bodyLog(), goods:goodsLog(), ledger:ledgerLog(), mood:moodLog() };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`心怡工作台备份_${keyDate}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  alert("已导出备份文件 ✓");
}
function importAll(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
    const data=JSON.parse(r.result);
    if(data && data.main) localStorage.setItem(DB.key, JSON.stringify(data.main));
    if(data && data.body) setBodyLog(data.body);
    if(data && data.goods) setGoodsLog(data.goods);
    if(data && data.ledger) setLedgerLog(data.ledger);
    if(data && data.mood) setMoodLog(data.mood);
    alert("导入成功，正在刷新…"); location.reload();
  } catch(e){ alert("文件格式不对，导入失败"); } };
  r.readAsText(file);
}
function wipeAll(){ if(confirm("确定清空所有数据？此操作不可恢复！")){ localStorage.clear(); sessionStorage.clear(); location.reload(); } }

/* ===== 每日本地自动备份（兜底，不依赖网络） ===== */
const AB_KEY='xinyi_autobak';
const AB_MAX=5;                 // 本地最多保留 5 份快照
const AB_MAXBYTES=4*1024*1024;  // 单份上限 ~4MB（localStorage 总量约 5MB）
function autoBakList(){
  try{ return JSON.parse(localStorage.getItem(AB_KEY))||[]; }catch(e){ return []; }
}
function takeAutoSnapshot(){
  const bak=autoBakList();
  const data={ _app:"xinyi-workbench", _ver:2, _auto:1,
    _time:new Date().toISOString(),
    main:DB.all(), body:bodyLog(), goods:goodsLog(), ledger:ledgerLog(), mood:moodLog() };
  const json=JSON.stringify(data);
  if(json.length>AB_MAXBYTES){           // 超限则只留主库
    data.body=[]; data.goods=[]; data.ledger=[]; 
  }
  bak.unshift({ ts:Date.now(), time:new Date().toLocaleString(), payload:data });
  while(bak.length>AB_MAX) bak.pop();
  try{ localStorage.setItem(AB_KEY, JSON.stringify(bak)); return true; }catch(e){
    // localStorage 写满：只保留最新一份重试
    try{ localStorage.setItem(AB_KEY, JSON.stringify(bak.slice(0,1))); return true; }catch(e2){ return false; }
  }
}
function lastAutoBak(){
  const b=autoBakList(); return b.length? b[0].time : '从未';
}
function autoBakCount(){ return autoBakList().length; }
function restoreAutoSnapshot(){
  const b=autoBakList();
  if(!b.length){ alert('本地暂无自动备份'); return; }
  const data=b[0].payload;
  if(!confirm('确定恢复到「'+b[0].time+'」的本地快照？\n（当前数据会被覆盖）')) return;
  if(data.main) localStorage.setItem(DB.key, JSON.stringify(data.main));
  if(data.body) setBodyLog(data.body);
  if(data.goods) setGoodsLog(data.goods);
  if(data.ledger) setLedgerLog(data.ledger);
  if(data.mood) setMoodLog(data.mood);
  alert('已从本地快照恢复 ✓'); location.reload();
}
function exportAutoSnapshot(){
  const b=autoBakList(); if(!b.length){ alert('本地暂无自动备份'); return; }
  const blob=new Blob([JSON.stringify(b,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`心怡工作台_本地自动备份_${keyDate}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  alert("已导出本地自动备份 ✓");
}
function startDailyBackup(){
  const last=localStorage.getItem('xinyi_auto_bak_date')||'';
  const today=keyDate;
  if(last!==today){ takeAutoSnapshot(); localStorage.setItem('xinyi_auto_bak_date', today); }
  // 之后每天进入时自动补拍一份（覆盖当天的为主）
  setInterval(()=>{ const d=localStorage.getItem('xinyi_auto_bak_date')||''; if(d!==keyDate){ takeAutoSnapshot(); localStorage.setItem('xinyi_auto_bak_date', keyDate); } }, 12*60*60*1000);
}

function wxExport(){
  const data={ _app:"xinyi-workbench", _ver:2, _time:new Date().toISOString(), main:DB.all(), body:bodyLog(), goods:goodsLog(), ledger:ledgerLog(), mood:moodLog() };
  const txt=SYNC_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
  const box=document.getElementById('wxArea'); if(box){ box.value=txt; box.focus(); box.select(); }
  alert("已生成同步文本并复制 ✓\n请粘贴到微信「文件传输助手」");
}
function wxImport(){
  const box=document.getElementById('wxArea'); if(!box) return;
  const txt=(box.value||'').trim();
  if(!txt.startsWith(SYNC_PREFIX)){ alert("文本格式不对（应以 XINYI1:: 开头）"); return; }
  try{
    const json=decodeURIComponent(escape(atob(txt.slice(SYNC_PREFIX.length))));
    const data=JSON.parse(json);
    if(data.main) localStorage.setItem(DB.key, JSON.stringify(data.main));
    if(data.body) setBodyLog(data.body); if(data.goods) setGoodsLog(data.goods); if(data.ledger) setLedgerLog(data.ledger); if(data.mood) setMoodLog(data.mood);
    alert("恢复成功，正在刷新…"); location.reload();
  }catch(e){ alert("解析失败："+e.message); }
}

function viewPlan(){
  def("plan");
  const tasks=DB.get("plan",[]); const done=DB.get("planDone",[]);
  let rows=tasks.map((t,i)=>done.includes(i)?'':`<div class="task" data-i="${i}">
    <div class="box" onclick="togglePlan(${i})"></div>
    <div class="txt" onclick="togglePlan(${i})">${esc(t)}</div>
    <button class="del" onclick="delPlan(${i})">×</button></div>`).join('');
  const hist=DB.get("planHist",[]);
  const byDay={}; hist.forEach(h=>{(byDay[h.date]=byDay[h.date]||[]).push(h.text);});
  const days=Object.keys(byDay).sort().reverse();
  const histHTML=days.length?`<div class="history-sec"><div class="sec-title">📚 已完成历史（按日期折叠）</div>${days.map(d=>`
    <div class="hist-day" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
      <span>📅 ${d}</span><span class="cnt">${byDay[d].length} 项已完成</span><span class="arrow">▶</span></div>
    <div class="hist-body">${byDay[d].map(t=>`<div class="row"><span class="tag">✓</span><div style="flex:1">${esc(t)}</div></div>`).join('')}</div>`).join('')}</div>`:'';
  return `<div class="page-title">📋 每日计划</div><div class="page-desc">勾选完成，进度会同步到首页</div>
    <div class="sec-title">Today · ${keyDate}</div>
    <div id="planList">${rows||'<p style="color:var(--ink-soft)">还没有任务，下面加一个吧～</p>'}</div>
    <div class="add"><input id="planIn" placeholder="添加今日待办…" onkeydown="if(event.key==='Enter')addPlan()">
    <button onclick="addPlan()">添加</button></div>
    ${histHTML}`;
}
function togglePlan(i){
  let d=DB.get("planDone",[]); let h=DB.get("planHist",[]); const tasks=DB.get("plan",[]);
  if(d.includes(i)){ d=d.filter(x=>x!==i); const ti=tasks[i]; const idx=h.map(x=>x.text).lastIndexOf(ti); if(idx>=0)h.splice(idx,1); }
  else { d.push(i); h.push({text:tasks[i],date:keyDate}); }
  DB.set("planDone",d); DB.set("planHist",h); refreshPlan();
}
function delPlan(i){let t=DB.get("plan",[]),d=DB.get("planDone",[]);t.splice(i,1);d=d.filter(x=>x!==i);DB.set("plan",t);DB.set("planDone",d);refreshPlan();}
function addPlan(){const v=document.getElementById('planIn').value.trim();if(!v)return;let t=DB.get("plan",[]);t.push(v);DB.set("plan",t);document.getElementById('planIn').value='';refreshPlan();}
function refreshPlan(){ setRoute('plan'); }

let engQ=0,engScore=0,engCur=null,engType='cn2en';
function engPool(){ const p=[]; NCE.forEach(l=>l.words.forEach(w=>p.push(w))); return p; }

function engNext(){
  const box=document.getElementById('engGame'); if(!box) return;
  if(engType==='order'){
    const l=NCE[Math.floor(Math.random()*NCE.length)];
    const s=(l.sent&&l.sent[0])||'';
    const words=s.split(' ').filter(Boolean);
    const shuffled=[...words].sort(()=>Math.random()-.5);
    engQ++;
    box.innerHTML=`<div class="gq-q">🔤 第 ${engQ} 题（连词成句）· 得分 ${engScore}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin:4px 0">点下面单词，依次排成课文原句：</div>
      <div id="orderBox" style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">${shuffled.map((w,i)=>`<button class="gq-btn" style="flex:0 0 auto;padding:8px 12px" onclick="orderPick(${i})" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>
      <div id="orderAns" style="display:flex;flex-wrap:wrap;gap:6px;min-height:42px;margin-bottom:6px"></div>
      <button class="btn btn-pink" onclick="orderCheck('${esc(s)}')">✅ 检查</button>
      <button class="btn btn-soft" style="margin-left:6px" onclick="engStart('order')">🔄 换一句</button>
      <div class="gq-fb" id="gqfb"></div>`;
    return;
  }
  const pool=engPool(); if(!pool.length) return;
  engCur=pool[Math.floor(Math.random()*pool.length)];
  let q,opts,a;
  if(engType==='cn2en'){ q=`「${engCur.cn}」用英语怎么说？`; const o=pool.filter(w=>w.en!==engCur.en).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.en); opts=[engCur.en,...o].sort(()=>Math.random()-.5); a=engCur.en; }
  else if(engType==='en2cn'){ q=`「${engCur.en}」是什么意思？`; const o=pool.filter(w=>w.cn!==engCur.cn).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.cn); opts=[engCur.cn,...o].sort(()=>Math.random()-.5); a=engCur.cn; }
  else if(engType==='listen'){ q=`🔊 听发音，选中文意思`; const o=pool.filter(w=>w.cn!==engCur.cn).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.cn); opts=[engCur.cn,...o].sort(()=>Math.random()-.5); a=engCur.cn; setTimeout(()=>speak(engCur.en),150); }
  engQ++;
  box.innerHTML=`<div class="gq-q">第 ${engQ} 题 · 得分 ${engScore}</div>
    <div class="gq-q" style="font-size:15px">${q}</div>
    <div class="gq-opts">${opts.map(o=>`<button class="gq-btn" onclick='engAnswer(${JSON.stringify(o)},${JSON.stringify(a)})'>${esc(o)}</button>`).join('')}</div>
    <div class="gq-fb" id="gqfb"></div>
    <div class="gq-score">点任意选项看对错，自动进入下一题</div>`;
}
function engAnswer(o,a){
  const fb=document.getElementById('gqfb'); if(!fb) return;
  if(o===a){ engScore++; fb.innerHTML='✅ 答对啦！'; fb.style.color='#5a9e3a'; }
  else { fb.innerHTML='❌ 正确是 '+esc(a); fb.style.color='#c0623a'; }
  setTimeout(engNext,800);
}
function orderPick(i){ const b=document.getElementById('orderBox'); const btn=b.children[i]; if(!btn||btn.dataset.used)return; btn.dataset.used='1'; btn.style.visibility='hidden'; const ans=document.getElementById('orderAns'); const n=document.createElement('button'); n.className='gq-btn'; n.style.flex='0 0 auto'; n.style.padding='8px 12px'; n.textContent=btn.dataset.w; n.onclick=()=>{ n.remove(); btn.style.visibility='visible'; btn.dataset.used=''; }; ans.appendChild(n); }
function orderCheck(correct){
  const ans=document.getElementById('orderAns'); const got=Array.from(ans.children).map(c=>c.textContent).join(' ');
  const fb=document.getElementById('gqfb');
  if(got===correct){ engScore++; fb.innerHTML='✅ 完全正确！'; fb.style.color='#5a9e3a'; }
  else { fb.innerHTML='❌ 正确是：'+esc(correct); fb.style.color='#c0623a'; }
}

function ieltsBlock(k,ic,tip,pr,items){
  const sample = k==='speak' ? "Could you tell me how much it costs?" : k==='listen' ? "The early bird catches the worm." : k==='read' ? "Practice makes perfect." : "I believe education plays a vital role in our lives.";
  return `<div class="ielts-block"><div class="ielts-h">${ic} <span class="ielts-tip">${tip}</span></div>
    <div class="ielts-practice"><span class="ph">📝 基础练习</span>${pr}</div>
    <div class="speak-btns"><button class="wear-btn" onclick="speak('${esc(sample)}')">🔊 朗读示范</button></div>
    <div id="ielts_${k}">${items.map((x,i)=>`<div class="task ${x.done?'done':''}" onclick="tgIeltsItem('${k}',${i})">
      <div class="box">${x.done?'✓':''}</div><div class="txt">${esc(x.t)}</div>
      <button class="del" onclick="event.stopPropagation();delIeltsItem('${k}',${i})">×</button></div>`).join('')}</div>

function refreshIelts(k){const P=DB.get("ieltsPlan",DEF.ieltsPlan);document.getElementById('ielts_'+k).innerHTML=P[k].map((x,i)=>`<div class="task ${x.done?'done':''}" onclick="tgIeltsItem('${k}',${i})"><div class="box">${x.done?'✓':''}</div><div class="txt">${esc(x.t)}</div><button class="del" onclick="event.stopPropagation();delIeltsItem('${k}',${i})">×</button></div>`).join('');}

  const days=new Date(y,m+1,0).getDate();
  const cells=[]; for(let i=0;i<firstDow;i++)cells.push(null); for(let d=1;d<=days;d++)cells.push(d);
  const mLog=log.filter(x=>x.date.startsWith(ym));
  const recDays=mLog.length, perDays=mLog.filter(x=>x.period).length;
  const t=log.find(x=>x.date===bodySel);
  const selStates=t?t.states:[]; const selPer=t?t.period:false; const selNote=t?t.note:'';
  return `<div class="page-title">🌡️ 体感实录</div><div class="page-desc">点日历上的日子，记录 / 回看身体状态</div>
    <div class="stat-row"><div class="ministat"><b>${recDays}</b>本月记录</div><div class="ministat"><b>${perDays}</b>本月生理期</div></div>

      <div class="cal-grid">${cells.map(c=>{
        if(c===null) return '<span class="cal-cell empty"></span>';
        const ds=ym+'-'+String(c).padStart(2,'0');
        const rec=log.find(x=>x.date===ds); const isSel=ds===bodySel;
        let cls='cal-cell'+(isSel?' sel':'')+(rec?' has':'');
        let mk=rec?(rec.period?'🩸':(rec.states&&rec.states.length?'•':'')):'';
        return `<span class="${cls}" onclick="bodySelect('${ds}')">${c}${mk?`<i class="cal-mark">${mk}</i>`:''}</span>`;
      }).join('')}</div>
    </div>
    <div class="sec-title">📝 记录 / 查看（${bodySel}）</div>
    <div class="chips" id="bodyStates">${BODY_STATES.map(s=>`<button class="chip ${selStates.includes(s)?'on':''}" data-s="${s}" onclick="this.classList.toggle('on')">${s}</button>`).join('')}</div>
    <div class="sec-title">生理期</div>
    <button class="wear-btn ${selPer?'on':''}" id="bodyPer" onclick="this.classList.toggle('on')">${selPer?'🩸 今天是生理期':'🩶 标记生理期'}</button>
    <div class="sec-title">哪里不舒服 / 原因</div>
    <textarea class="ta" id="bodyNote" placeholder="比如：肩颈酸痛，可能是昨天久坐 + 受凉">${esc(selNote)}</textarea>
    <button class="btn btn-pink" style="width:100%;margin-top:6px" onclick="saveBody()">💾 保存记录</button>
    <div class="sec-title">本月记录</div>
    <div id="bodyHist">${bodyHistHTML(mLog)}</div>`;
}
